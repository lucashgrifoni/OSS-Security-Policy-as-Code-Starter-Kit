# OSS Security Policy as Code Starter Kit — stricter GitHub Level 2 baseline
# Use this template when your team already has mature GitHub Actions workflows and wants
# stricter clone-visible checks than github-level-1 (reusable workflow hygiene, runner trust, etc.).
# Prefer github-level-1 for greenfield repos; graduate to level-2 when workflows are stable.
#
# Actions are pinned to immutable commit SHAs (release tag in the trailing
# comment) because `CI-PIN-008` in the profile this job runs requires it —
# a tag pin would make this template fail the baseline it evaluates.
name: OSS Policy Check (GitHub Level 2)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  oss-policy-check:
    name: Evaluate OSS policy (github-level-2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install oss-policy-kit
        run: pip install oss-policy-kit

      - name: Evaluate OSS policy baseline (level 2)
        run: |
          python -P -m oss_policy_kit evaluate \
            --target . \
            --profile github-level-2 \
            --fail-on fail \
            --output-dir ./oss-policy-reports

      - name: Upload policy reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oss-policy-reports
          path: ./oss-policy-reports/
          retention-days: 30
