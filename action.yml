# OSS Security Policy as Code Starter Kit -- GitHub Action wrapper.
#
# Composite action that installs the published `oss-policy-kit` PyPI
# distribution in a hermetic virtualenv and runs `evaluate` against the
# repository. SARIF output is optional and never enabled by default so the
# action remains safe to use in private repositories without a Code
# Scanning license.
#
# Inputs map 1:1 to the CLI flags so existing local invocations translate
# directly. The action never modifies files in the repository: it only
# reads them and writes reports under `output-dir`.
#
# Versioning: this file is published from the same tag as the PyPI wheel, and
# the wheel installed always matches the action revision you pinned. Pin a full
# tag (e.g. `@v10.0.13`), a major line (`@v10`), or -- recommended for production
# -- a commit SHA; all three resolve to the exact wheel that revision ships.
# Override with the `kit-version` input, or set it to `latest` to opt out of
# pinning entirely.

name: 'OSS Security Policy as Code'
description: 'Evaluate a repository against bundled OSS security baselines (governance, CI/CD, supply chain).'
author: 'Lucas Henrique Grifoni'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  target:
    description: 'Path to the repository root to evaluate. Defaults to the workspace.'
    required: false
    default: '.'
  profile:
    description: |
      Profile ID (e.g. github-level-1, github-release-hardening-2) or path
      to an external YAML profile. Omit to read the profile from
      oss-policy-kit.yaml at the target.
    required: false
    default: ''
  fail-on:
    description: 'CI gate mode: none, fail, or degraded. Defaults to fail.'
    required: false
    default: 'fail'
  output-dir:
    description: 'Directory where evaluation-report.json / .md will be written.'
    required: false
    default: 'oss-policy-reports'
  waivers:
    description: 'Optional path to a waivers YAML file (kept under version control).'
    required: false
    default: ''
  scorecard-json:
    description: 'Optional OpenSSF Scorecard JSON export used as supplemental evidence.'
    required: false
    default: ''
  sarif-output:
    description: |
      Optional SARIF 2.1.0 file path (relative paths resolve under output-dir).
      When set, the action emits SARIF; uploading it to Code Scanning is the
      caller's responsibility (e.g. via github/codeql-action/upload-sarif).
    required: false
    default: ''
  kit-version:
    description: |
      Pin a specific oss-policy-kit version on PyPI. Defaults to the version
      that matches the action revision you pinned -- including SHA pins, which
      resolve from the action's own checkout. Use `latest` to install the newest
      release instead of a pinned one.
    required: false
    default: ''
  python-version:
    description: 'Python version used to run the kit. 3.12+ is required.'
    required: false
    default: '3.12'

outputs:
  report-json:
    description: 'Absolute path to evaluation-report.json'
    value: ${{ steps.run.outputs.report_json }}
  report-markdown:
    description: 'Absolute path to evaluation-report.md'
    value: ${{ steps.run.outputs.report_md }}
  sarif:
    description: 'Absolute path to the SARIF file (only set when sarif-output was provided).'
    value: ${{ steps.run.outputs.sarif }}
  exit-code:
    description: 'Exit code returned by `oss-policy-kit evaluate` (0 / 1 / 2 / 3).'
    value: ${{ steps.run.outputs.exit_code }}

runs:
  using: 'composite'
  steps:
    - name: Resolve kit version
      id: resolve
      shell: bash
      env:
        INPUT_KIT_VERSION: ${{ inputs.kit-version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        # Normalise the adopter's input before anything reads it. Whitespace is invisible in
        # a YAML value, and a trailing space failed the job with a message that showed the
        # requested and installed versions looking identical; a newline emitted a second line
        # into GITHUB_OUTPUT, which is an output-injection primitive.
        INPUT_KIT_VERSION="$(printf '%s' "${INPUT_KIT_VERSION}" | tr -d '[:space:]')"
        # `latest` is the documented opt-out from pinning, and it has to be spelled as
        # an empty pin: `pip install oss-policy-kit==latest` is not valid syntax, so
        # passing kit-version: latest -- which this action's own input description
        # offers -- used to fail the install step outright.
        if [ "$(printf '%s' "${INPUT_KIT_VERSION}" | tr '[:upper:]' '[:lower:]')" = "latest" ]; then
          echo "kit_version=" >> "${GITHUB_OUTPUT}"
        elif [ -n "${INPUT_KIT_VERSION}" ]; then
          echo "kit_version=${INPUT_KIT_VERSION}" >> "${GITHUB_OUTPUT}"
        elif [[ "${ACTION_REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          # Pinned to a release tag: install the matching wheel.
          echo "kit_version=${ACTION_REF#v}" >> "${GITHUB_OUTPUT}"
        else
          # Pinned to a SHA, a major/minor tag (`@v10`), or a branch. This branch used
          # to emit an empty pin, so `pip install oss-policy-kit` took whatever was
          # newest on PyPI -- meaning the SHA pin this file recommends for production
          # gave a LESS reproducible install than a tag, and the wheel could be a
          # different major than the action code being run beside it.
          #
          # GITHUB_ACTION_PATH is this action's own checkout at the pinned revision, so
          # the version that revision corresponds to is right there. Read it, and fail
          # closed if it cannot be read rather than silently falling back to unpinned.
          # `|| true` so a missing file reaches the error below instead of tripping
          # `set -e` here: the run would still stop, but with no message saying why.
          version="$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' \
            "${GITHUB_ACTION_PATH}/src/oss_policy_kit/__init__.py" 2>/dev/null | head -n 1 || true)"
          if [ -z "${version}" ]; then
            echo "::error::Could not resolve the oss-policy-kit version for action ref '${ACTION_REF}'." \
                 "Set the 'kit-version' input explicitly (or 'latest' to track the newest release)." >&2
            exit 1
          fi
          echo "kit_version=${version}" >> "${GITHUB_OUTPUT}"
        fi

    - name: Set up Python
      # Pinned to a full commit SHA per the repo's supply-chain hygiene policy.
      # The trailing comment records the semantic tag used to resolve the SHA;
      # rotate intentionally via Dependabot or the maintainer SHA-refresh flow.
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install oss-policy-kit
      shell: bash
      env:
        KIT_VERSION: ${{ steps.resolve.outputs.kit_version }}
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        if [ -n "${KIT_VERSION}" ]; then
          python -m pip install "oss-policy-kit==${KIT_VERSION}"
        else
          python -m pip install "oss-policy-kit"
        fi
        # Ask the INSTALLED DISTRIBUTION its version, not an import.
        #
        # This check first ran `python -m oss_policy_kit --version` from the workspace, and
        # the workspace is the adopter's repository -- which, when that repository is this
        # kit, contains `src/oss_policy_kit/`. The import then resolved to the checkout
        # rather than to the wheel pip had just installed, so the guard compared the pin
        # against the source tree being evaluated and would have reported agreement no
        # matter which wheel arrived. A verification step that verifies nothing is worse
        # than none: it reads as proof.
        #
        # `importlib.metadata.version` reads dist-info, so an import cannot shadow it. `-P`
        # keeps the script directory off sys.path for the same reason.
        installed="$(python -P -c 'from importlib.metadata import version; print(version("oss-policy-kit"))')"
        echo "oss-policy-kit ${installed}"
        # Exact match after trimming, not containment: `*10.0.1*` matches "10.0.13", so a
        # near-miss version passed the check that exists to catch exactly that.
        if [ -n "${KIT_VERSION}" ] \
           && [ "$(printf '%s' "${installed}" | tr -d '[:space:]')" \
              != "$(printf '%s' "${KIT_VERSION}" | tr -d '[:space:]')" ]; then
          echo "::error::Requested oss-policy-kit ${KIT_VERSION} but installed ${installed}." >&2
          exit 1
        fi

    - name: Run evaluate
      id: run
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_WAIVERS: ${{ inputs.waivers }}
        INPUT_SCORECARD_JSON: ${{ inputs.scorecard-json }}
        INPUT_SARIF_OUTPUT: ${{ inputs.sarif-output }}
      run: |
        set -uo pipefail
        args=(evaluate --target "${INPUT_TARGET}" --output-dir "${INPUT_OUTPUT_DIR}" --fail-on "${INPUT_FAIL_ON}")
        if [ -n "${INPUT_PROFILE}" ]; then
          args+=(--profile "${INPUT_PROFILE}")
        fi
        if [ -n "${INPUT_WAIVERS}" ]; then
          args+=(--waivers "${INPUT_WAIVERS}")
        fi
        if [ -n "${INPUT_SCORECARD_JSON}" ]; then
          args+=(--scorecard-json "${INPUT_SCORECARD_JSON}")
        fi
        if [ -n "${INPUT_SARIF_OUTPUT}" ]; then
          args+=(--sarif-output "${INPUT_SARIF_OUTPUT}")
        fi
        python -m oss_policy_kit "${args[@]}"
        rc=$?
        out_dir="${INPUT_OUTPUT_DIR}"
        report_json="${GITHUB_WORKSPACE}/${out_dir}/evaluation-report.json"
        report_md="${GITHUB_WORKSPACE}/${out_dir}/evaluation-report.md"
        echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
        echo "report_json=${report_json}" >> "${GITHUB_OUTPUT}"
        echo "report_md=${report_md}" >> "${GITHUB_OUTPUT}"
        if [ -n "${INPUT_SARIF_OUTPUT}" ]; then
          if [[ "${INPUT_SARIF_OUTPUT}" = /* ]]; then
            sarif_path="${INPUT_SARIF_OUTPUT}"
          else
            sarif_path="${GITHUB_WORKSPACE}/${out_dir}/${INPUT_SARIF_OUTPUT}"
          fi
          echo "sarif=${sarif_path}" >> "${GITHUB_OUTPUT}"
        fi
        # Write a GitHub Actions job summary + per-finding annotations from the report.
        # Best-effort: ${GITHUB_ACTION_PATH} is this action's own checkout, and a failure
        # here (|| true) never changes the evaluation exit code forwarded below.
        if [ -f "${report_json}" ]; then
          python "${GITHUB_ACTION_PATH}/scripts/action_summary.py" "${report_json}" || true
        fi
        # Forward the kit's exit code so branch protection and required-check
        # gates behave the way operators expect (1 when --fail-on is tripped).
        exit "${rc}"
