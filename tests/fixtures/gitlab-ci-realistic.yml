# Realistic GitLab CI pipeline fixture for parser regression coverage.
# Covers: multi-stage, default block, includes (local + remote + project), templates,
# rules: with if/changes/exists, manual gates, parallel matrix, retry, services,
# environments, OIDC id_tokens, before_script, inherit secrets, services with images.
# Used by tests/infrastructure/test_gitlab_ci_parser_realistic.py to ensure the
# parser does not crash and produces consistent signals on representative input.

include:
  - local: '.gitlab/ci/build.yml'
  - local: '.gitlab/ci/deploy.yml'
  - project: 'shared/templates'
    file: '/python.yml'
    ref: 'v1.4.2'
  - remote: 'https://gitlab.example.com/ci/security-scan.yml'
  - template: 'Security/SAST.gitlab-ci.yml'

variables:
  PYTHON_VERSION: "3.12.4"
  DOCKER_DRIVER: overlay2

default:
  image: registry.example.com/python:3.12.4-slim
  before_script:
    - pip install --upgrade pip
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  tags:
    - linux
    - docker

stages:
  - lint
  - test
  - build
  - security
  - deploy

# Templates (start with dot — not jobs themselves)
.deploy-template:
  image: alpine:3.19
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

lint:py:
  stage: lint
  image: python:3.12.4-alpine
  script:
    - pip install ruff==0.5.6
    - ruff check .

lint:yaml:
  stage: lint
  image: cytopia/yamllint:1.35
  script:
    - yamllint -d relaxed .

test:unit:
  stage: test
  image: python:3.12.4-slim
  services:
    - name: postgres:16.4
      alias: db
    - redis:7.2-alpine
  variables:
    POSTGRES_DB: testdb
  parallel:
    matrix:
      - PYTEST_SHARD: ["1/4", "2/4", "3/4", "4/4"]
  script:
    - pip install -r requirements-dev.txt
    - pytest --shard $PYTEST_SHARD
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

test:integration:
  stage: test
  image: python:3.12.4-slim
  script:
    - pytest tests/integration
  needs: [test:unit]
  allow_failure: true

build:docker:
  stage: build
  image: docker:27.0.3-cli
  services:
    - docker:27.0.3-dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

security:sast:
  stage: security
  image: returntocorp/semgrep:1.83.0
  script:
    - semgrep --config=auto --sarif --output=sast.sarif.json .
  artifacts:
    paths: [sast.sarif.json]
    when: always
    expire_in: 1 week

security:secrets:
  stage: security
  image: zricethezav/gitleaks:v8.18.4
  script:
    - gitleaks detect --report-format sarif --report-path gitleaks.sarif.json
  allow_failure: true

deploy:staging:
  extends: .deploy-template
  stage: deploy
  environment:
    name: staging
    url: https://staging.example.com
  id_tokens:
    OIDC_TOKEN:
      aud: https://aws-account.example.com/staging
  script:
    - ./scripts/deploy.sh staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "release/staging"'
      when: manual

deploy:production:
  extends: .deploy-template
  stage: deploy
  environment:
    name: production
    url: https://prod.example.com
  inherit:
    secrets:
      - PROD_DEPLOY_KEY
      - PROD_SIGNING_KEY
  id_tokens:
    OIDC_TOKEN:
      aud: https://aws-account.example.com/production
  script:
    - ./scripts/deploy.sh production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
  needs:
    - job: build:docker
      artifacts: false
