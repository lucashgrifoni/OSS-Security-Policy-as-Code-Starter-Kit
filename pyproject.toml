[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-policy-kit"
version = "10.0.0"
description = "Open source starter kit for adopting OSS security baselines via policy packs, templates, evidence, and remediation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Lucas Henrique Grifoni" }]
keywords = ["open-source", "security", "policy", "github-actions", "devsecops", "osps"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.12.5",
  "click>=8.1.8,<8.5",
  "pyyaml>=6.0.1",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
github = ["httpx>=0.27"]
gitlab = ["httpx>=0.27"]
azure = ["httpx>=0.27"]
aws = ["boto3>=1.34", "botocore>=1.34"]
iac = ["python-hcl2>=6.1"]
all = ["httpx>=0.27", "boto3>=1.34", "botocore>=1.34", "python-hcl2>=6.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.0,<7",
    "ruff==0.15.16",  # pinned: ruff format output changes between versions; keep CI and local identical
  "mypy>=1.11",
  "bandit>=1.7.9",
  "pip-audit>=2.7",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.20",
  "build>=1.2",
  "twine>=5.0",
  "cyclonedx-bom>=4.0",
  "httpx>=0.27",
  "boto3>=1.34",
  "botocore>=1.34",
  "moto>=5.0.26",
  "python-hcl2>=6.1",
]

# Third-party evaluator plugins can register custom controls via:
#   [project.entry-points."oss_policy_kit.evaluators"]
#   "ORG-CTRL-001" = "my_package.evaluators:eval_org_ctrl_001"
# The callable must match: Callable[[EvalContext], EvalOutcome] with EvalContext from
# oss_policy_kit.application.evaluators and EvalOutcome from oss_policy_kit.domain.models.
# External plugins cannot override built-in control IDs.

[project.scripts]
oss-policy-kit = "oss_policy_kit.cli.main:main"

[project.urls]
Homepage = "https://github.com/lucashgrifoni/OSS-Security-Policy-as-Code-Starter-Kit"
Repository = "https://github.com/lucashgrifoni/OSS-Security-Policy-as-Code-Starter-Kit"
Documentation = "https://github.com/lucashgrifoni/OSS-Security-Policy-as-Code-Starter-Kit#readme"
Changelog = "https://github.com/lucashgrifoni/OSS-Security-Policy-as-Code-Starter-Kit/blob/master/CHANGELOG.md"
Issues = "https://github.com/lucashgrifoni/OSS-Security-Policy-as-Code-Starter-Kit/issues"
Security = "https://github.com/lucashgrifoni/OSS-Security-Policy-as-Code-Starter-Kit/blob/master/SECURITY.md"

[tool.setuptools.packages.find]
where = ["src"]

# Policy payloads only (YAML/JSON). Do not use `data/**/*`: it also picks up
# `__pycache__/*.pyc` under `data/schema/` when present locally.
[tool.setuptools.package-data]
oss_policy_kit = ["data/**/*.yaml", "data/**/*.json"]

[tool.setuptools.exclude-package-data]
oss_policy_kit = [
  "**/__pycache__",
  "**/__pycache__/**",
  "**/*.py[co]",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests", "scripts"]
exclude = ["gitpage", ".venv", ".venv-ci", ".venv-smoke", ".venv-v5-baseline", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90"]

# Cyclomatic-complexity gate (mccabe). Blocks NEW functions above the threshold.
# The ~33 functions already above it at gate introduction (M4-B) are baselined with
# inline `# noqa: C901`; reduce them incrementally (tracked in the local backlog
# `ruff-c90-complexity-gate`). Do not raise this number to accommodate a regression.
[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# The evaluators package re-exports a shared namespace via `from ._shared import *`
# (M8 refactor, ADR-026). F403/F405 are the cost of that intentional re-export pattern;
# mypy (strict) still catches genuinely undefined names.
"src/oss_policy_kit/application/evaluators/*.py" = ["F403", "F405"]
"src/oss_policy_kit/cli/main.py" = ["B008"]
"src/oss_policy_kit/cli/common.py" = ["B008"]
"src/oss_policy_kit/cli/evaluate.py" = ["B008"]
"src/oss_policy_kit/cli/batch.py" = ["B008"]
"src/oss_policy_kit/cli/evidence.py" = ["B008"]
"src/oss_policy_kit/cli/init.py" = ["B008"]
"src/oss_policy_kit/cli/profiles.py" = ["B008"]
"src/oss_policy_kit/cli/scan_sast.py" = ["B008"]
"src/oss_policy_kit/cli/scan_iac.py" = ["B008"]
"src/oss_policy_kit/cli/scan_k8s.py" = ["B008"]
"src/oss_policy_kit/cli/scan_cfn.py" = ["B008"]
"src/oss_policy_kit/cli/scan_pulumi.py" = ["B008"]
"src/oss_policy_kit/cli/scan_bicep.py" = ["B008"]
"src/oss_policy_kit/cli/recommend.py" = ["B008"]
"src/oss_policy_kit/cli/reports.py" = ["B008"]
"src/oss_policy_kit/cli/emit_vex.py" = ["B008"]
"src/oss_policy_kit/cli/emit_insights.py" = ["B008"]
"src/oss_policy_kit/cli/ingest_insights.py" = ["B008"]
"src/oss_policy_kit/cli/ingest_scorecard.py" = ["B008"]
"src/oss_policy_kit/cli/correlate_findings.py" = ["B008"]
"src/oss_policy_kit/cli/export_evidence.py" = ["B008"]
"src/oss_policy_kit/cli/export_policy.py" = ["B008"]
"src/oss_policy_kit/cli/diff_catalogs.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
packages = ["oss_policy_kit"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["oss_policy_kit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# Conservative floor: measured ~92% across the full suite (unit + property). The floor
# sits a few points below that to absorb Hypothesis-seed variance and Windows/Linux
# branch differences (CI measures on Linux). Raise as coverage grows; never lower it to
# accommodate a regression.
fail_under = 88
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
