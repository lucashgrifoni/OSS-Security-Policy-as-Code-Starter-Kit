[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-policy-kit"
version = "10.0.26"
description = "Open source starter kit for adopting OSS security baselines via policy packs, templates, evidence, and remediation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Lucas Henrique Grifoni" }]
keywords = ["open-source", "security", "policy", "github-actions", "devsecops", "osps"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  # 0.26, not 0.12.5. `cli/common.py` imports `typer.core.HAS_RICH`, which first exists in
  # typer 0.19.0, and every command module imports `cli/common.py`. Every resolution in the
  # seven releases from 0.12.5 to 0.18.0 therefore produced an install pip called successful
  # and a CLI where every command exited 1 with `ImportError: cannot import name HAS_RICH`
  # before doing anything. It held only because pip picks the newest typer; a constraints
  # file, a mirror, an offline index or a co-installed transitive pin all reach that range.
  #
  # The floor is 0.26 rather than 0.19 because `tests/cli/test_a_stream_that_is_gone_is_not_a
  # _defect.py` asserts that the Abort typer raises is typer's own, which typer began
  # vendoring in 0.26.0. A floor the project's own suite fails at is not a floor it supports.
  "typer>=0.26",
  # Imported at module scope by six shipped modules and declared nowhere until now. It reached
  # every environment only through typer's requirements, so the kit's import-time correctness
  # rested on a promise in someone else's metadata across a typer range with no ceiling, and
  # typer publishes a slim distribution without rich. 13.8.0 is the floor typer itself declares
  # from 0.25, and the kit uses nothing newer.
  "rich>=13.8.0",
  # Nothing under `src/` imports click, and from 0.26 typer vendors its own copy, so this line
  # constrains neither the kit nor typer. It stays because removing it changes the closure every
  # adopter and the published image install, which is a packaging decision rather than part of
  # fixing a floor.
  #
  # The ceiling is the next MAJOR, not the next minor. It used to be `<8.5`, a bound that
  # was never chosen: Dependabot walked it forward one minor at a time (`<8.4` -> `<8.5`,
  # #12) and nobody wrote down what a newer click broke, because nothing did -- the full
  # CLI suite passes on 8.5.0, and typer 0.27 declares no click constraint of its own.
  # A ceiling on a runtime dependency is a promise that the version past it breaks
  # something; without a named breakage the honest ceiling is the semver major.
  "click>=8.1.8,<9",
  "pyyaml>=6.0.1",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
github = ["httpx>=0.27"]
gitlab = ["httpx>=0.27"]
azure = ["httpx>=0.27"]
aws = ["boto3>=1.34", "botocore>=1.34"]
# 7.0, not 6.1. The suite was run against every declared floor at once for the first time
# on 2026-09-19, and this was the only one that did not hold: at 6.1.0 and 6.1.1, three IaC
# tests fail. They do not fail loudly. `IAC-TF-001` through `IAC-TF-004` answer
# `manual-review-required` where the fixture should give `pass`, and `IAC-TF-009` does not
# trigger on a vulnerable fixture at all, so an adopter resolving to the old floor gets
# wrong verdicts rather than an error. Bisected: 6.1.0 and 6.1.1 fail, 7.0.0, 7.1.0, 7.3.1
# and 8.1.4 pass, and the whole suite is green at 7.0.0 with every other floor still at its
# floor. An import check would have missed it: `python-hcl2==6.1.1` imports cleanly and has
# both `load` and `loads`.
iac = ["python-hcl2>=7.0"]
all = ["httpx>=0.27", "boto3>=1.34", "botocore>=1.34", "python-hcl2>=7.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.0,<7",
    "ruff==0.16.8",  # pinned: ruff format output changes between versions; keep CI and local identical
  "mypy>=1.11",
  "bandit>=1.7.9",
  "pip-audit>=2.7",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.20",
  "build>=1.2",
  "twine>=5.0",
  "cyclonedx-bom>=4.0",
  "httpx>=0.27",
  "boto3>=1.34",
  "botocore>=1.34",
  "moto>=5.0.26",
  "python-hcl2>=7.0",
  # An independent CommonMark reader for the guard in
  # `tests/application/test_a_name_from_the_filesystem_is_not_markdown.py`, which asks what a
  # reader of the report actually sees rather than re-deriving the spec rule the fix is built
  # on. `rich` happens to pull the same package in today; a guard that relies on somebody
  # else's transitive dependency stops running the day that dependency changes.
  "markdown-it-py>=3.0",
  # The CEL half of `export-policy` is verified by two tests that `importorskip("celpy")`.
  # Without this line they skipped in every environment, local and CI, while the Rego half
  # ran against a real `opa` binary the workflow installs. A generated gate that never
  # compiles is a gate that never denies, and nothing was checking that it compiles.
  "cel-python>=0.1.5",
]

# Third-party evaluator plugins can register custom controls via:
#   [project.entry-points."oss_policy_kit.evaluators"]
#   "ORG-CTRL-001" = "my_package.evaluators:eval_org_ctrl_001"
# The callable must match: Callable[[EvalContext], EvalOutcome] with EvalContext from
# oss_policy_kit.application.evaluators and EvalOutcome from oss_policy_kit.domain.models.
# External plugins cannot override built-in control IDs.

[project.scripts]
oss-policy-kit = "oss_policy_kit.cli.main:main"

[project.urls]
Homepage = "https://github.com/lucashgrifoni/OSS-Security-Policy-as-Code-Starter-Kit"
Repository = "https://github.com/lucashgrifoni/OSS-Security-Policy-as-Code-Starter-Kit"
Documentation = "https://github.com/lucashgrifoni/OSS-Security-Policy-as-Code-Starter-Kit#readme"
Changelog = "https://github.com/lucashgrifoni/OSS-Security-Policy-as-Code-Starter-Kit/blob/master/CHANGELOG.md"
Issues = "https://github.com/lucashgrifoni/OSS-Security-Policy-as-Code-Starter-Kit/issues"
Security = "https://github.com/lucashgrifoni/OSS-Security-Policy-as-Code-Starter-Kit/blob/master/SECURITY.md"

[tool.setuptools.packages.find]
where = ["src"]

# Policy payloads only (YAML/JSON). Do not use `data/**/*`: it also picks up
# `__pycache__/*.pyc` under `data/schema/` when present locally.
# `py.typed` (PEP 561) must ship too: the package exposes a typed extension contract
# (`domain/plugin_contract.py`, the `oss_policy_kit.evaluators` entry-point group), and
# without this marker a plugin author's type checker treats the whole package as untyped.
#
# `data/**/*.yml` is NOT redundant with `*.yaml`: the workflow templates `init
# --with-workflow` writes are `.yml`, and leaving that extension out shipped a wheel
# with no templates at all. The documented quickstart then exited 2 with "Workflow
# template not found" on every install, while the test suite stayed green because it
# runs from the repo root, where the source-tree fallback exists.
[tool.setuptools.package-data]
oss_policy_kit = ["py.typed", "data/**/*.yaml", "data/**/*.yml", "data/**/*.json"]

[tool.setuptools.exclude-package-data]
oss_policy_kit = [
  "**/__pycache__",
  "**/__pycache__/**",
  "**/*.py[co]",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests", "scripts"]
exclude = ["gitpage", ".venv", ".venv-ci", ".venv-smoke", ".venv-v5-baseline", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90"]

# Cyclomatic-complexity gate (mccabe). Blocks NEW functions above the threshold.
# The ~33 functions already above it at gate introduction (M4-B) are baselined with
# inline `# noqa: C901`; reduce them incrementally (tracked in the local backlog
# `ruff-c90-complexity-gate`). Do not raise this number to accommodate a regression.
[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# The evaluators package re-exports a shared namespace via `from ._shared import *`
# (M8 refactor, ADR-026). F403/F405 are the cost of that intentional re-export pattern;
# mypy (strict) still catches genuinely undefined names.
"src/oss_policy_kit/application/evaluators/*.py" = ["F403", "F405"]
"src/oss_policy_kit/cli/main.py" = ["B008"]
"src/oss_policy_kit/cli/common.py" = ["B008"]
"src/oss_policy_kit/cli/evaluate.py" = ["B008"]
"src/oss_policy_kit/cli/batch.py" = ["B008"]
"src/oss_policy_kit/cli/evidence.py" = ["B008"]
"src/oss_policy_kit/cli/init.py" = ["B008"]
"src/oss_policy_kit/cli/profiles.py" = ["B008"]
"src/oss_policy_kit/cli/scan_sast.py" = ["B008"]
"src/oss_policy_kit/cli/scan_iac.py" = ["B008"]
"src/oss_policy_kit/cli/scan_k8s.py" = ["B008"]
"src/oss_policy_kit/cli/scan_cfn.py" = ["B008"]
"src/oss_policy_kit/cli/scan_pulumi.py" = ["B008"]
"src/oss_policy_kit/cli/scan_bicep.py" = ["B008"]
"src/oss_policy_kit/cli/recommend.py" = ["B008"]
"src/oss_policy_kit/cli/reports.py" = ["B008"]
"src/oss_policy_kit/cli/emit_vex.py" = ["B008"]
"src/oss_policy_kit/cli/emit_insights.py" = ["B008"]
"src/oss_policy_kit/cli/ingest_insights.py" = ["B008"]
"src/oss_policy_kit/cli/ingest_scorecard.py" = ["B008"]
"src/oss_policy_kit/cli/correlate_findings.py" = ["B008"]
"src/oss_policy_kit/cli/export_evidence.py" = ["B008"]
"src/oss_policy_kit/cli/export_policy.py" = ["B008"]
"src/oss_policy_kit/cli/diff_catalogs.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
packages = ["oss_policy_kit"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["oss_policy_kit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# 100 is the measured state, not an aspiration: every statement and every branch in src/ is
# exercised. The floor sits there so a new uncovered line fails the run that introduced it,
# which is the only moment covering it is cheap. Restate it in
# .github/workflows/github-ci-cd.yml too -- CI passes --cov-fail-under on the command line,
# so changing only one leaves the gate at the old value.
#
# What the last points cost, and why they were still worth taking. The earlier note here
# argued for staying below 100, because two audited cases (the release-hardening fallbacks in
# profile_hints, the emptied PROFILE_DIRECTORY_ALIASES) were unreachable by construction and
# the four tests that "covered" one of them asserted `isinstance(result, list)` on a state the
# caller cannot produce -- executing the line while checking nothing. That danger is real and
# the answer is not a lower floor: it is to prove unreachability rather than assert it, then
# delete the code or mark it. Fourteen branches survive that way, each carrying
# `# pragma: no cover` (or `no branch`, where only one arm is dead) and the reason beside it.
# The push to 100 also found two live defects, so the last points bought more than a number.
#
# Never lower this to accommodate a regression.
fail_under = 100
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  # A bare `...` is the body of a Protocol method or an abstract stub. It is
  # unexecutable by construction -- nothing ever calls the declaration itself --
  # so counting it as a missed line reports untestable syntax as untested code.
  "^\\s*\\.\\.\\.$",
]
