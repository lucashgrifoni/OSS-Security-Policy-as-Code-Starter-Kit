# Uploads the static gitpage/ site directly to GitHub Pages. The site is plain HTML + Babel-in-browser
# JSX (no Node toolchain), so this workflow has no install/build steps. Third-party actions are pinned
# to full commit SHAs (CI-PIN-008) to match repository policy.

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - "gitpage/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

# Only `deploy` needs `pages: write` and `id-token: write`. Granting them here would
# hand them to `build` as well, which only reads the checkout and uploads an artifact.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Upload gitpage/ artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./gitpage

  deploy:
    name: Deploy artifact
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
