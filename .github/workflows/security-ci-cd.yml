# Security CI/CD
#
# Standard security pipeline covering:
#   - SAST          : Semgrep, Snyk Code, CodeQL
#   - SCA           : Snyk Open Source, Trivy (filesystem vuln), Dependency Review (PR)
#   - IaC / Pipeline: Trivy (misconfig), KICS (Checkmarx)
#   - Secrets       : Trivy (secret), Gitleaks (git history)
#   - Workflow lint : actionlint
#
# Supply-chain hardening:
#   - Third-party and first-party actions are pinned to immutable commit SHAs.
#   - The trailing comment records the semantic tag used to resolve the SHA.
#   - Keep `.github/dependabot.yml` enabled for `github-actions` so Dependabot
#     can refresh SHA pins through reviewable pull requests.
#
# Harden-Runner egress:
#   - Now in `egress-policy: block` per job (2026-05-22), using the Harden-Runner
#     dashboard's aggregated Recommended Policy (baselines stable 100+ runs).
#   - To extend an allowlist: re-check the job's recommended policy in the
#     step-security insights, then add the host to that job's `allowed-endpoints`.
#   - Rollback: set a job back to `egress-policy: audit` if a legitimate
#     endpoint is blocked (Harden-Runner names the blocked host in the run log).
#
# Semgrep severity mapping:
#   - WARNING = medium-severity findings
#   - ERROR   = high-severity findings
#
# kics-scan disable=baee238e-1921-4801-9c3f-79ae1d7b2cbc
# ^ "Passwords And Secrets - Generic Token": false positive. The lines below
#   document required secret NAMES; their values are never hardcoded here and
#   are injected at runtime from GitHub Actions secrets (${{ secrets.* }}).
# Required repository or organization secrets:
#   - SNYK_TOKEN          : Snyk Code and Snyk Open Source scans
#   - GITLEAKS_LICENSE    : required only for organizations using the paid
#                           gitleaks-action license
#
# GITHUB_TOKEN is supplied automatically by GitHub Actions.
# SARIF uploads require `security-events: write`. This permission is set at
# the workflow level and, when applicable, tightened at job level. On private
# repositories, SARIF upload and Dependency Review require GitHub Advanced
# Security; on public repositories both are free.

name: Security CI/CD

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  merge_group:

# Least-privilege top level: read-only. Jobs that upload SARIF elevate to
# `security-events: write` themselves, and CodeQL adds `actions: read`. Keeping
# the top level read-only satisfies Scorecard Token-Permissions (no workflow-
# scoped write token).
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"
  TRIVY_SEVERITY: "MEDIUM,HIGH,CRITICAL"
  TRIVY_SKIP_DIRS: ".git,node_modules,dist,build,coverage"
  SNYK_SEVERITY_THRESHOLD: "medium"

jobs:
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            semgrep.dev:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Semgrep
        # Hash-pinned (Scorecard Pinned-Dependencies): the scanner that decides whether
        # this repository ships is itself a supply-chain dependency, and a range like
        # ">=1.100.0,<2" let any release inside it -- and every transitive package --
        # enter the job unverified. Regenerate with:
        #   uv pip compile .github/requirements/semgrep.in --generate-hashes \
        #     --python-version 3.12 --python-platform linux \
        #     -o .github/requirements/semgrep.txt
        run: python -m pip install --require-hashes -r .github/requirements/semgrep.txt

      - name: Scan application and workflow code
        # `examples/vulnerable-repo/` is a deliberately insecure fixture: the kit ships it so
        # `evaluate` has something that legitimately fails, and the test suite asserts on its
        # contents. Its findings are true positives about the fixture, not about the product,
        # so it is excluded here. Prefer --exclude over a repo-level `.semgrepignore`, which
        # would REPLACE semgrep's built-in ignore defaults rather than add to them.
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/github-actions \
            --severity WARNING \
            --exclude examples/vulnerable-repo \
            --sarif --output=semgrep.sarif \
            --error \
            --metrics=off \
            .

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sast-snyk-code:
    name: SAST - Snyk Code
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.snyk.io:443
            deeproxy.snyk.io:443
            downloads.snyk.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Snyk CLI
        # Pinned: this job holds SNYK_TOKEN, so a floating `latest` would let any
        # future npm publish run with that secret in the environment. Nothing
        # watches this pin automatically -- Dependabot does not read
        # `npm install -g` lines.
        run: npm install -g snyk@1.1306.3

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth "$SNYK_TOKEN"

      - name: Run Snyk Code
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >
          snyk code test
          --severity-threshold=${{ env.SNYK_SEVERITY_THRESHOLD }}
          --sarif-file-output=snyk-code.sarif

      - name: Upload Snyk Code SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read # CodeQL reads workflow run metadata (required on private repos)
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Harden runner
        # CodeQL `init` downloads the analysis bundle when it is not already in
        # the runner toolcache. The Harden-Runner recommended-policy baseline
        # missed these hosts because those runs hit a warm toolcache; on a cold
        # cache the bundle is fetched as a GitHub release asset
        # (objects / release-assets.githubusercontent.com, fronted by Fastly/AWS)
        # and the job fails closed with ECONNREFUSED without them.
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"

  sca-snyk:
    name: SCA - Snyk Open Source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.snyk.io:443
            downloads.snyk.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Snyk CLI
        # Pinned: this job holds SNYK_TOKEN, so a floating `latest` would let any
        # future npm publish run with that secret in the environment. Nothing
        # watches this pin automatically -- Dependabot does not read
        # `npm install -g` lines.
        run: npm install -g snyk@1.1306.3

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth "$SNYK_TOKEN"

      - name: Run Snyk Open Source scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >
          snyk test
          --all-projects
          --severity-threshold=${{ env.SNYK_SEVERITY_THRESHOLD }}
          --sarif-file-output=snyk-oss.sarif

      - name: Upload Snyk Open Source SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-oss

  sca-trivy:
    name: SCA - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            check.trivy.dev:443
            get.trivy.dev:443
            mirror.gcr.io:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Scan dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-deps.sarif
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}

      - name: Upload Trivy dependency SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-deps

  base-image-trivy:
    name: Base image - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # `audit`, not `block`, and for the reason publish-container.yml already records:
          # Docker Hub serves blobs from dynamic CloudFront hosts and allowed-endpoints has
          # no wildcard support, so an exact list cannot be written. My first attempt tried
          # and the run failed on `production.cloudfront.docker.com` -- a host I had guessed
          # as Cloudflare. Harden-Runner's global C2/exfiltration blocklist still applies.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # The three Trivy jobs around this one are all `scan-type: fs`. Nothing scanned the
      # container base, so the digest pinned in the Dockerfile went unexamined from the day
      # it was pinned -- and Dependabot cannot refresh it either, because its docker updater
      # fires on a newer TAG and `3.12-slim-bookworm` is a rolling tag whose name never
      # changes. Two layers of apparent coverage, neither of which looked at this image.
      #
      # The digest is read out of the Dockerfile rather than repeated here: a second copy is
      # a second thing to drift.
      - name: Resolve the pinned base image
        id: base
        run: |
          set -euo pipefail
          ref="$(grep -m1 -oE 'python:[0-9.]+-slim-bookworm@sha256:[0-9a-f]{64}' Dockerfile)"
          if [ -z "${ref}" ]; then
            echo "::error::Could not read the pinned base image from Dockerfile." >&2
            exit 1
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "Scanning ${ref}"

      # Reported, not gated, and the distinction is deliberate. These are Debian packages:
      # the fix exists upstream but arrives only when the base image is rebuilt, which this
      # repository does not control. Failing the build would break CI on a repository with no
      # changes and train everyone to ignore it. The findings land in code scanning, where
      # they are tracked and dated, and `ignore-unfixed` means every one of them is actionable
      # by bumping the digest.
      - name: Scan the base image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.base.outputs.ref }}
          scanners: vuln
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-base-image.sarif

      - name: Upload Trivy base-image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-base-image.sarif
          category: trivy-base-image

  iac-and-pipeline-trivy:
    name: IaC and Pipeline - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            check.trivy.dev:443
            mirror.gcr.io:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Scan IaC and workflow misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "1"
          format: sarif
          output: trivy-iac.sarif
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}

      - name: Upload Trivy IaC SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  iac-kics:
    name: IaC - KICS (Checkmarx)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        # KICS builds a Chainguard wolfi-base container and `apk add nodejs npm`.
        # The apk index loads from apk.cgr.dev, but package blobs are served from
        # a Cloudflare R2 bucket whose name is opaque/may rotate, so it is
        # allowed via the scoped wildcard *.r2.cloudflarestorage.com rather than a
        # brittle exact bucket hash (Harden-Runner insights run 26298261213).
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            kics.io:443
            registry.npmjs.org:443
            apk.cgr.dev:443
            *.r2.cloudflarestorage.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Scan IaC with KICS
        uses: Checkmarx/kics-github-action@05aa5eb70eede1355220f4ca5238d96b397e30a6 # v2.1.20
        with:
          path: "."
          output_path: kics-results
          output_formats: sarif
          fail_on: medium,high,critical
          enable_comments: false
          enable_annotations: false
          exclude_paths: ".git,node_modules,dist,build,coverage"
          # Accepted (not a vulnerability): "Apt Get Install Pin Version Not
          # Defined". The only apt usage is the Dockerfile builder stage (tools
          # never shipped in the runtime image); Debian rotates point-release
          # versions within weeks, so a hard `pkg=version` pin becomes
          # uninstallable and breaks the build for no security gain. See the
          # Dockerfile comment for full rationale.
          exclude_queries: 965a08d7-ef86-4f14-8792-4a3b2098937e

      - name: Upload KICS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: kics-results/results.sarif
          category: kics

  secrets-trivy:
    name: Secrets - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            check.trivy.dev:443
            get.trivy.dev:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Scan repository files for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "1"
          format: sarif
          output: trivy-secrets.sarif
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}

      - name: Upload Trivy secrets SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-secrets.sarif
          category: trivy-secrets

  secrets-history-gitleaks:
    name: Secrets History - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan git history for leaked secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          # gitleaks-action v2.3.9 (latest) still declares `runs.using:
          # node20`, which GitHub forces to Node 24 from 2026-06-02 and removes
          # on 2026-09-16. Opt in early, scoped to this step only, so the action
          # runs on Node 24 without affecting other actions. Remove once
          # upstream ships a Node 24 release and the SHA pin is bumped.
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  dependency-review:
    name: SCA - Dependency Review (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.securityscorecards.dev:443
            api.deps.dev:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # `api.deps.dev` is required above: dependency-review-action queries deps.dev for
      # package metadata, and only does so when the pull request actually introduces
      # dependencies. Every earlier PR had an empty dependency delta, so the call was
      # never made and the missing endpoint stayed invisible — the job passed by having
      # nothing to look up. The first PR to add dependencies (the hash-pinned lockfiles
      # in .github/requirements/) hit the block and surfaced as a bare `fetch failed`,
      # with the cause only visible in the Harden-Runner log line `domain not allowed:
      # api.deps.dev.`.
      - name: Review new dependencies introduced by the pull request
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # No advisory exceptions. This job carried three (GHSA-hvrp-rf83-w775,
          # GHSA-jpw9-pfvf-9f58, GHSA-vj7q-gjh5-988w against mcp 1.23.3, which semgrep pinned
          # exactly) under a stated removal condition: semgrep depending on mcp >= 1.28.1.
          # semgrep 1.173.0 pins mcp==1.29.0, so the condition was met and the allowance is
          # gone rather than inherited. An exception with a removal condition nobody rechecks
          # is a permanent exception wearing a note.

  workflow-lint:
    name: Workflow Lint - actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            auth.docker.io:443
            registry-1.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: devops-actions/actionlint@9fb9c192862f19e684586ca84b500461bcd8a541 # pinned

  sca-pip-audit:
    name: SCA - pip-audit (Python deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install project runtime dependencies
        # Editable install so pip-audit can skip the first-party package
        # (oss-policy-kit) via --skip-editable. Auditing our own freshly
        # built version is meaningless and races PyPI on release commits,
        # while runtime dependencies are still installed and audited.
        # Upgrade pip first: the runner ships pip 26.1.1 (PYSEC-2026-196,
        # fixed in 26.1.2). pip is a build tool, not a project dependency,
        # so we patch it at the source rather than --ignore-vuln the finding.
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          python -m pip install -e .

      - name: Audit Python dependencies
        # Gate: pip-audit exits non-zero on any known vulnerability by
        # default, so real CVEs fail the job. --skip-editable excludes the
        # first-party editable package (auditing our own build is meaningless
        # and races PyPI on release commits). --strict is intentionally NOT
        # used: it would treat the deliberately skipped editable package as an
        # un-auditable dependency and fail the run. A CVE present only in a
        # [dev] dependency with no fix must be recorded as a documented
        # exception, never silenced with a blind --ignore-vuln.
        run: |
          python -m pip install --require-hashes -r .github/requirements/pip-audit.txt
          python -m pip_audit --desc --skip-editable

  sast-bandit:
    name: SAST - Bandit (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bandit SAST scan
        # Gate: fail on medium+ severity AND medium+ confidence findings
        # (-ll -ii). Lower-signal findings are reported but non-blocking.
        run: |
          python -m pip install --require-hashes -r .github/requirements/bandit.txt
          python -m bandit -q -r src/oss_policy_kit -ll -ii

  findings-correlation:
    name: Findings Correlation (dogfooding)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the kit from source
        # From source, not from PyPI: this job has to exercise the commit under
        # test, not the last release.
        run: python -m pip install -e .

      - name: Produce zizmor SARIF into the evidence directory
        # `correlate-findings` reads external SARIF from
        # .oss-policy-kit/evidence/sast/<tool>.sarif.json. Until this job existed,
        # nothing in CI wrote there, so the command ran on kit-internal evidence
        # only and the external half of its pipeline was never exercised.
        # --no-online-audits keeps the run inside the egress allowlist.
        run: |
          python -m pip install --require-hashes -r .github/requirements/zizmor.txt
          mkdir -p .oss-policy-kit/evidence/sast
          zizmor --format sarif --no-online-audits .github/workflows/ \
            > .oss-policy-kit/evidence/sast/zizmor.sarif.json

      - name: Produce the kit's own scanner evidence
        # The five internal sources. Each writes .oss-policy-kit/evidence/*.json
        # and exits 0 even with nothing to report, which is what a repo with no
        # IaC looks like.
        run: |
          python -m oss_policy_kit scan-iac --target . || true
          python -m oss_policy_kit scan-k8s --target . || true
          python -m oss_policy_kit scan-cfn --target . || true
          python -m oss_policy_kit scan-pulumi --target . || true
          python -m oss_policy_kit scan-bicep --target . || true

      - name: Correlate findings
        # Not a gate. --fail-on-severity is deliberately unset: this job exists to
        # prove the command runs end-to-end on real evidence and to publish the
        # artifact, not to block a merge on a scanner's opinion of a workflow file.
        # Turning it into a gate is a separate decision with its own threshold.
        run: |
          python -m oss_policy_kit correlate-findings \
            --target . \
            --output .oss-policy-kit/findings.json \
            --format human

      - name: Show which sources were actually read
        # The honest part: a source that is `missing` must be visible, otherwise
        # this job looks like coverage it does not have.
        run: |
          python - <<'EOF'
          import json
          d = json.load(open(".oss-policy-kit/findings.json", encoding="utf-8"))
          print(f"findings: {d['findings_total']}  by severity: {d['findings_by_severity']}")
          for s in d["sources_read"]:
              print(f"  {s['status']:14} {s['kind']:14} {s['tool']}")
          EOF

      - name: Upload the findings artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        if: always()
        with:
          name: findings-correlation
          path: |
            .oss-policy-kit/findings.json
            .oss-policy-kit/evidence/sast/zizmor.sarif.json
          retention-days: 14
