# Security CI/CD
#
# Standard security pipeline covering:
#   - SAST          : Semgrep, Snyk Code, CodeQL
#   - SCA           : Snyk Open Source, Trivy (filesystem vuln), Dependency Review (PR)
#   - IaC / Pipeline: Trivy (misconfig), KICS (Checkmarx)
#   - Secrets       : Trivy (secret), Gitleaks (git history)
#   - Workflow lint : actionlint
#
# Supply-chain hardening:
#   - Third-party and first-party actions are pinned to immutable commit SHAs.
#   - The trailing comment records the semantic tag used to resolve the SHA.
#   - Keep `.github/dependabot.yml` enabled for `github-actions` so Dependabot
#     can refresh SHA pins through reviewable pull requests.
#
# Harden-Runner egress:
#   - Start with `egress-policy: audit` for 2-4 weeks per repository.
#   - Review the Harden-Runner insights/recommended policy for each job.
#   - Then switch to `egress-policy: block` and add the observed
#     job-specific `allowed-endpoints` allowlist.
#   - Block-mode syntax:
#       egress-policy: block
#       allowed-endpoints: |
#         <observed-host>:443
#
# Semgrep severity mapping:
#   - WARNING = medium-severity findings
#   - ERROR   = high-severity findings
#
# kics-scan disable=baee238e-1921-4801-9c3f-79ae1d7b2cbc
# ^ "Passwords And Secrets - Generic Token": false positive. The lines below
#   document required secret NAMES; their values are never hardcoded here and
#   are injected at runtime from GitHub Actions secrets (${{ secrets.* }}).
# Required repository or organization secrets:
#   - SNYK_TOKEN          : Snyk Code and Snyk Open Source scans
#   - GITLEAKS_LICENSE    : required only for organizations using the paid
#                           gitleaks-action license
#
# GITHUB_TOKEN is supplied automatically by GitHub Actions.
# SARIF uploads require `security-events: write`. This permission is set at
# the workflow level and, when applicable, tightened at job level. On private
# repositories, SARIF upload and Dependency Review require GitHub Advanced
# Security; on public repositories both are free.

name: Security CI/CD

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  merge_group:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"
  TRIVY_SEVERITY: "MEDIUM,HIGH,CRITICAL"
  TRIVY_SKIP_DIRS: ".git,node_modules,dist,build,coverage"
  SNYK_SEVERITY_THRESHOLD: "medium"

jobs:
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Semgrep
        run: python -m pip install --upgrade "semgrep>=1.100.0,<2"

      - name: Scan application and workflow code
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/github-actions \
            --severity WARNING \
            --sarif --output=semgrep.sarif \
            --error \
            --metrics=off \
            .

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sast-snyk-code:
    name: SAST - Snyk Code
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth "$SNYK_TOKEN"

      - name: Run Snyk Code
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >
          snyk code test
          --severity-threshold=${{ env.SNYK_SEVERITY_THRESHOLD }}
          --sarif-file-output=snyk-code.sarif

      - name: Upload Snyk Code SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          category: "/language:${{ matrix.language }}"

  sca-snyk:
    name: SCA - Snyk Open Source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth "$SNYK_TOKEN"

      - name: Run Snyk Open Source scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >
          snyk test
          --all-projects
          --severity-threshold=${{ env.SNYK_SEVERITY_THRESHOLD }}
          --sarif-file-output=snyk-oss.sarif

      - name: Upload Snyk Open Source SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-oss

  sca-trivy:
    name: SCA - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Scan dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-deps.sarif
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}

      - name: Upload Trivy dependency SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-deps

  iac-and-pipeline-trivy:
    name: IaC and Pipeline - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Scan IaC and workflow misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "1"
          format: sarif
          output: trivy-iac.sarif
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}

      - name: Upload Trivy IaC SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  iac-kics:
    name: IaC - KICS (Checkmarx)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Scan IaC with KICS
        uses: Checkmarx/kics-github-action@05aa5eb70eede1355220f4ca5238d96b397e30a6 # v2.1.20
        with:
          path: "."
          output_path: kics-results
          output_formats: sarif
          fail_on: medium,high,critical
          enable_comments: false
          enable_annotations: false
          exclude_paths: ".git,node_modules,dist,build,coverage"
          # Accepted (not a vulnerability): "Apt Get Install Pin Version Not
          # Defined". The only apt usage is the Dockerfile builder stage (tools
          # never shipped in the runtime image); Debian rotates point-release
          # versions within weeks, so a hard `pkg=version` pin becomes
          # uninstallable and breaks the build for no security gain. See the
          # Dockerfile comment for full rationale.
          exclude_queries: 965a08d7-ef86-4f14-8792-4a3b2098937e

      - name: Upload KICS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          sarif_file: kics-results/results.sarif
          category: kics

  secrets-trivy:
    name: Secrets - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Scan repository files for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "1"
          format: sarif
          output: trivy-secrets.sarif
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}

      - name: Upload Trivy secrets SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          sarif_file: trivy-secrets.sarif
          category: trivy-secrets

  secrets-history-gitleaks:
    name: Secrets History - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan git history for leaked secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          # gitleaks-action v2.3.9 (latest) still declares `runs.using:
          # node20`, which GitHub forces to Node 24 from 2026-06-02 and removes
          # on 2026-09-16. Opt in early, scoped to this step only, so the action
          # runs on Node 24 without affecting other actions. Remove once
          # upstream ships a Node 24 release and the SHA pin is bumped.
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  dependency-review:
    name: SCA - Dependency Review (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Review new dependencies introduced by the pull request
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  workflow-lint:
    name: Workflow Lint - actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: devops-actions/actionlint@9fb9c192862f19e684586ca84b500461bcd8a541 # pinned

  sca-pip-audit:
    name: SCA - pip-audit (Python deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install project runtime dependencies
        # Editable install so pip-audit can skip the first-party package
        # (oss-policy-kit) via --skip-editable. Auditing our own freshly
        # built version is meaningless and races PyPI on release commits,
        # while runtime dependencies are still installed and audited.
        run: python -m pip install -e .

      - name: Audit Python dependencies
        # Gate: pip-audit exits non-zero on any known vulnerability by
        # default, so real CVEs fail the job. --skip-editable excludes the
        # first-party editable package (auditing our own build is meaningless
        # and races PyPI on release commits). --strict is intentionally NOT
        # used: it would treat the deliberately skipped editable package as an
        # un-auditable dependency and fail the run. A CVE present only in a
        # [dev] dependency with no fix must be recorded as a documented
        # exception, never silenced with a blind --ignore-vuln.
        run: |
          python -m pip install pip-audit
          python -m pip_audit --desc --skip-editable

  sast-bandit:
    name: SAST - Bandit (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bandit SAST scan
        # Gate: fail on medium+ severity AND medium+ confidence findings
        # (-ll -ii). Lower-signal findings are reported but non-blocking.
        run: |
          python -m pip install bandit
          python -m bandit -q -r src/oss_policy_kit -ll -ii
