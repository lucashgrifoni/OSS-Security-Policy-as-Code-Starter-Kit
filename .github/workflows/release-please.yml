# release-please: automate version bumps + CHANGELOG from Conventional Commits.
#
# How it works:
#   1. On every push to `master`, release-please scans commit messages since the
#      last release.
#   2. If it finds `feat:` / `fix:` / `BREAKING CHANGE:` commits, it opens (or
#      updates) a "release PR" containing:
#        - bumped version in pyproject.toml + src/oss_policy_kit/__init__.py
#          (the latter via the `# x-release-please-version` marker)
#        - a regenerated CHANGELOG.md entry (sections mapped to
#          Highlights / Improvements / Notes — see release-please-config.json)
#   3. Merging that PR triggers release-please again, which tags the commit and
#      creates a GitHub Release (draft).
#   4. The pushed `v*` tag fires the rest of the pipeline:
#        - publish-pypi.yml      -> build, attest, publish to PyPI
#        - publish-container.yml -> build, cosign sign, publish to GHCR
#        - release.yml           -> rewrite the draft Release body into the
#                                   standard template (## <full name> vX.Y.Z /
#                                   This release is ... / Highlights /
#                                   Improvements / Notes / License)
#      The maintainer then refines the one-line summary and publishes the draft.
#
# Authentication: a short-lived GitHub App installation token (minted per run)
# is used instead of the default GITHUB_TOKEN, for two reasons:
#   1. Security — avoids enabling the broad repo setting "Allow GitHub Actions to
#      create and approve pull requests". The App token is scoped to the App's
#      permissions (contents / pull-requests / issues) and expires in ~1 hour.
#   2. Cascade — tags/PRs created with the default GITHUB_TOKEN do NOT trigger
#      other workflows, so the release tag would never fire publish-pypi.yml /
#      publish-container.yml / release.yml. An App token is a distinct actor and
#      does trigger the downstream release pipeline.
# Setup: a GitHub App (Contents RW, Pull requests RW, Issues RW) installed on
# this repo, with the App's Client ID and private key stored as the repository
# secrets RELEASE_PLEASE_APP_ID (holds the Client ID, e.g. Iv23...) and
# RELEASE_PLEASE_APP_PRIVATE_KEY. (create-github-app-token deprecated app-id in
# favor of client-id; the secret name is kept for continuity.)

name: release-please

on:
  push:
    branches: [master]
  workflow_dispatch:

# Least-privilege: the GITHUB_TOKEN stays read-only. The write scopes
# release-please needs are carried by the GitHub App token minted below.
permissions:
  contents: read

concurrency:
  group: release-please-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  release-please:
    name: Open or update release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # write scopes are supplied by the App token, not GITHUB_TOKEN
    outputs:
      # Empty when there is no open release PR, which is what gates the job below.
      release_branch: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Without these the minted token inherits every permission the App
          # installation holds. release-please needs exactly three: it writes the
          # release commit and tag (contents), opens and updates the release PR
          # (pull-requests), and labels it (issues).
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  # The version-stamp guard in tests/docs/test_sample_reports_match_the_shipped_contract.py
  # requires the checked-in sample reports to carry the version of the tree they sit in.
  # release-please bumps the tree and cannot regenerate the samples, so every release branch
  # arrived with the guard failing and a human had to regenerate by hand -- twice in a row
  # before this job existed. The dangerous shortcut it invites is editing the version string
  # directly, which is exactly what the guard's own message forbids: that would claim a
  # freshness the file does not have.
  refresh-sample-reports:
    name: Refresh the sample reports on the release PR
    needs: release-please
    if: needs.release-please.outputs.release_branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the push below uses the App token, not GITHUB_TOKEN
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out the release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.release_branch }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the bumped tree
        # Dependencies come from the hashed lock; the tree itself is installed with
        # --no-deps so the only unhashed artifact is the checkout being released.
        run: |
          python -m pip install --require-hashes -r .github/requirements/runtime-all.txt
          python -m pip install --no-deps -e .

      - name: Regenerate both sample labs
        run: |
          set -euo pipefail
          # Read the pinned epoch from the document that defines it rather than repeating the
          # number here. A second copy is a second thing to drift, and the whole point of the
          # pin is that the output is byte-identical between runs.
          epoch="$(grep -oE 'SOURCE_DATE_EPOCH=[0-9]+' docs/sample-reports/README.md | head -1 | cut -d= -f2)"
          if [ -z "${epoch}" ]; then
            echo "::error::No SOURCE_DATE_EPOCH found in docs/sample-reports/README.md. Regenerating without it would rewrite every timestamp." >&2
            exit 1
          fi
          echo "Using SOURCE_DATE_EPOCH=${epoch} from docs/sample-reports/README.md"
          export SOURCE_DATE_EPOCH="${epoch}"
          python -m oss_policy_kit evaluate --target ./examples/hardened-repo             --profile github-level-1 --output-dir ./docs/sample-reports/hardened --summary-only
          python -m oss_policy_kit evaluate --target ./examples/vulnerable-repo             --profile github-level-1 --output-dir ./docs/sample-reports/vulnerable --summary-only

      - name: Commit only if something actually changed
        env:
          BRANCH: ${{ needs.release-please.outputs.release_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/sample-reports/; then
            echo "Sample reports already match this tree; nothing to push."
            exit 0
          fi
          # Guard the blast radius: this job exists to move a version stamp, so anything
          # outside the sample reports means the regeneration did something unexpected and
          # the run should stop rather than commit it.
          if ! git diff --quiet -- . ':(exclude)docs/sample-reports/'; then
            echo "::error::Regeneration touched files outside docs/sample-reports/:" >&2
            git diff --name-only -- . ':(exclude)docs/sample-reports/' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sample-reports/
          git commit -m "chore(release): regenerate the sample reports for this version bump"
          git push origin "HEAD:${BRANCH}"
