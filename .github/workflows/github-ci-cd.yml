# Product CI for the Python package at repository root. Does not run npm at repo root.
# SBOM generation in the package job aligns with SBOM quality / provenance expectations (see BUILD-SBOM-QUAL-003 and release docs).

name: GitHub CI/CD

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
  merge_group:

# Note: this workflow intentionally has NO `paths-ignore`. The required Quality
# check includes the gitpage guardrail test (tests/infrastructure/test_gitpage_static_assets.py),
# so gitpage-only PRs must run it too. A previous `paths-ignore: gitpage/**` let a
# broken gitpage change (PR #29 Tailwind v4) reach master because Quality was skipped.

permissions:
  contents: read

concurrency:
  group: project-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    # Three legs. The first is the gate the ruleset requires by name and is unchanged.
    # The other two exist because six failures in one cycle were visible only on a
    # platform the suite had never run on: `pathlib` treats a backslash as an ordinary
    # character on POSIX, and a directory where a file belongs is "Permission denied"
    # on Windows and "Is a directory" on Linux. Twelve commits inherited that red
    # because the maintainer's gate runs on Windows and CI ran only on Linux. The 3.13
    # leg covers the other half of `requires-python = ">=3.12"`, which admitted a
    # version nothing had executed.
    #
    # Coverage, the property floor and the self-check gate stay on the first leg only:
    # the other two answer "does it run there", not "is every line covered there".
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Quality (lint, types, tests, self-check)
            os: ubuntu-latest
            python: "3.12"
            gate: true
          - name: Quality (ubuntu, Python 3.13)
            os: ubuntu-latest
            python: "3.13"
            gate: false
          - name: Quality (windows, Python 3.12)
            os: windows-latest
            python: "3.12"
            gate: false
    defaults:
      run:
        # One shell on every leg, so a step written once runs the same on Windows.
        shell: bash
    steps:
      - name: Harden runner
        # Linux only: the agent has no Windows build. The Windows leg runs without
        # an egress policy, which is the trade for having a Windows leg at all.
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install project (dev)
        # pip itself comes from the same hashed lock the image builds with, so the tool that
        # performs every other install is not itself an unpinned download.
        #
        # The dev extra deliberately is NOT hash-pinned, and the Scorecard reports it. A lock
        # for it would have to be regenerated in the same pull request as every Dependabot
        # bump of a dev tool, and a lock that drifts from `pyproject.toml` does not fail
        # loudly: CI would quietly test one version of ruff or mypy while the project
        # declares another, and a green run would stop meaning what it says. A false green
        # is a worse outcome than this finding, which covers tools that run only in CI on a
        # job with no secrets. Revisit if the job ever gains credentials.
        run: |
          python -m pip install --require-hashes -r .github/requirements/pip.txt
          python -m pip install -e ".[dev]"

      - name: Install OPA (pinned by hash)
        # `export-policy --format rego` is validated against the real interpreter, and
        # that test skipped everywhere because nothing installed opa -- in CI, in the
        # local gate, on any machine without it. A test that never runs gives the
        # confidence of one that does not exist. The binary is a GitHub release asset,
        # which is why the two githubusercontent hosts are in the egress allowlist.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/opa "https://github.com/open-policy-agent/opa/releases/download/v1.20.1/opa_linux_amd64_static"
          echo "0b3f152e61be276b70396cfbca49e39fc9d0c5089e0a8574e8f6a30f41a9187f  /tmp/opa" | sha256sum -c -
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
          opa version

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy src/oss_policy_kit

      - name: Public hygiene
        # The CHANGELOG has called this a release gate since it was added, but it ran
        # nowhere: only when somebody remembered it locally. It drifted red on master —
        # eleven violations, all synthetic fixtures, none of them a real leak, and none
        # of them noticed. A gate nobody triggers is not a gate, which is the same shape
        # as the drift check that sat permanently green through three major versions.
        run: python scripts/check_public_hygiene.py

      - name: Pytest
        # Measure coverage here but do not gate yet (--cov-fail-under=0); the
        # property-tests step appends and enforces the combined floor.
        if: matrix.gate
        run: python -m pytest tests --ignore=tests/property --cov=oss_policy_kit --cov-report= --cov-fail-under=0

      - name: Property-based tests
        # Append property-test coverage and enforce the combined floor
        # (fail_under=100 in pyproject; stated explicitly here as the gate).
        if: matrix.gate
        run: python -m pytest tests/property/ -v --hypothesis-show-statistics --cov=oss_policy_kit --cov-append --cov-report=term-missing --cov-fail-under=100

      - name: Pytest (no coverage floor on this leg)
        # The whole suite, property tests included, without the coverage instrument:
        # this leg answers whether the code behaves here, and the floor is held once.
        if: ${{ !matrix.gate }}
        run: python -m pytest tests -q -p no:cacheprovider

      - name: CLI help smoke
        run: |
          python -P -m oss_policy_kit --help
          python -P -m oss_policy_kit evaluate --help

      - name: Evaluate hardened example
        run: |
          python -P -m oss_policy_kit evaluate --target ./examples/hardened-repo --profile github-level-1 --output-dir ./out/ci-hardened-example

      - name: Self-check (github-level-1)
        run: |
          python -P -m oss_policy_kit evaluate --target . --profile github-level-1 --output-dir ./out/selfcheck-ci --fail-on fail

      - name: Smoke evaluate-many
        run: |
          python -P -m oss_policy_kit evaluate-many --target-root ./examples --profiles github-level-1 --output-dir ./out/ci-evaluate-many --skip-non-repos --quiet

      - name: Smoke scaffold-evidence
        run: |
          python -P -m oss_policy_kit scaffold-evidence --target ./out/ci-scaffold-test --platform github

      - name: Smoke collect-evidence dry-run
        run: |
          python -P -m oss_policy_kit collect-evidence --target . --platform github --repo "owner/repo" --output-dir ./out/ci-collect --dry-run

      - name: Smoke diff-reports
        run: |
          python -P -m oss_policy_kit diff-reports --before ./out/ci-hardened-example/evaluation-report.json --after ./out/selfcheck-ci/evaluation-report.json --no-fail-on-regression --format markdown

      - name: Upload evaluation outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oss-policy-kit-ci-out-${{ github.run_id }}
          path: ./out/**
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package (build, twine, SBOM)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install build tools
        # Hash-pinned (Scorecard Pinned-Dependencies). The `-e ".[dev]"` line below is
        # deliberately NOT hash-pinned: it installs this project from source with the
        # ranges pyproject.toml declares, which is what the test suite is meant to run
        # against. Pinning it here would test a frozen tree rather than the one adopters
        # resolve, and hide a dependency break until release day.
        run: |
          python -m pip install --require-hashes -r .github/requirements/pip.txt
          python -m pip install --require-hashes -r .github/requirements/build-tools.txt
          python -m pip install -e ".[dev]"

      - name: Clean artifact directories
        run: |
          rm -rf dist build src/*.egg-info

      # Bytecode for the exclusion rule to leave out. A fresh checkout has none, so the
      # check after the build would otherwise pass on an empty question.
      - name: Compile the source tree the build reads
        run: python -m compileall -q src/oss_policy_kit

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine check
        run: python scripts/twine_check_dist.py

      # Runs here because the artifact already exists. Building an sdist inside a unit test
      # would need setuptools, which a 3.12 virtual environment no longer installs, so that
      # test would reach the network or fail depending on the environment.
      - name: Refuse an sdist that ships a test slice which cannot run
        run: python scripts/check_sdist_test_slice.py

      - name: Refuse a distribution that ships bytecode
        run: python scripts/check_dist_ships_no_bytecode.py

      # Same rule the publishing workflow follows: inventory the built distribution, not whatever
      # this runner happens to have installed. Without a path argument the generator described the
      # CI environment -- dev tooling included -- which is not what the wheel carries.
      - name: Generate CycloneDX SBOM
        run: |
          # Generated the same way the publish workflow generates the released one, and for
          # the same reasons (see the comment block there). A rehearsal that runs a different
          # command rehearses nothing: this step existed to prove SBOM generation works before
          # a release, and it was proving it for a shape the release does not use.
          python -m venv --without-pip .sbom-env
          python -m pip --python .sbom-env/bin/python install dist/*.whl
          python -m cyclonedx_py environment .sbom-env             --pyproject pyproject.toml             --mc-type application             --output-format JSON --output-file dist/sbom.cyclonedx.json

      - name: Smoke install wheel
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ ${#wheels[@]} -eq 0 ]]; then
            echo "No wheel found under dist/" >&2
            exit 1
          fi
          # The glob is passed straight to pip rather than through the array element, and
          # the array is kept only to fail loudly when the build produced nothing. An
          # earlier comment here claimed `--no-deps` was what made this a pinned install.
          # It is not: Scorecard's `isUnpinnedPipInstall` treats an install as pinned when
          # an argument ends in `.whl`, and reads `"${wheels[0]}"` as an opaque token with
          # additional arguments, so the finding stood with the flag in place. `--no-deps`
          # earns its own keep for a different reason -- every dependency is already
          # installed from `.[dev]` above, so this step reaches for nothing on the network.
          python -m pip install --no-deps dist/*.whl
          python -P -m oss_policy_kit --help
          python -P -m oss_policy_kit evaluate --help

      # `pyproject.toml` classifies 3.13, and until this step nothing ran the built
      # artifact there: the quality matrix runs 3.13 against the SOURCE tree, and this job
      # is pinned to PYTHON_VERSION. The gap that leaves is narrow and worth naming rather
      # than overstating. The wheel is `py3-none-any`, so the same file installs on both,
      # and anything missing from it fails on 3.12 already. What only this step covers is
      # importing the installed layout under 3.13.
      #
      # A matrix over the whole job would rebuild, re-run twine and regenerate the SBOM to
      # get here. This reuses the wheel that was just built, in a virtual environment of
      # its own so it cannot borrow anything the job installed for 3.12.
      - name: Setup Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Smoke install wheel on 3.13
        run: |
          # `python` is 3.13 here: the step above just put it in front on PATH, and the
          # assert below refuses to continue if that is ever untrue.
          python -m venv .wheel-313
          # Hash-pinned for the same reason as the build tools above; the wheel itself is
          # a `.whl` argument, which is what makes the install below a pinned one.
          .wheel-313/bin/python -m pip install --require-hashes -r .github/requirements/pip.txt
          .wheel-313/bin/python -m pip install dist/*.whl
          .wheel-313/bin/python -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version"
          .wheel-313/bin/python -P -m oss_policy_kit --help
          .wheel-313/bin/python -P -m oss_policy_kit evaluate --help
          .wheel-313/bin/oss-policy-kit --version
          rm -rf .wheel-313

  dependency-floors:
    name: Dependency floors (suite at the lowest declared versions)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    # `pyproject.toml` promises that `python-hcl2>=7.0` works. Until 2026-09-19 nothing had
    # ever run the suite against those lower bounds, and one of the nine was wrong: at
    # `python-hcl2==6.1.x` four Terraform controls answered manual-review-required where the
    # fixture gives pass, and a fifth stopped triggering. Wrong verdicts, not an error, which
    # is why an import check had not caught it in three years of the floor being there.
    #
    # `tests/infrastructure/test_a_declared_floor_is_a_version_that_works.py` compares the
    # declared floor against a minimum a human recorded. This job is the other half: it
    # executes at the floor, so a recorded minimum that is simply wrong is caught by the
    # code rather than by the next person to check by hand.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project (dev)
        run: |
          python -m pip install --require-hashes -r .github/requirements/pip.txt
          python -m pip install -e ".[dev]"

      - name: Force every runtime dependency down to its declared floor
        # The pins are read out of pyproject.toml rather than written here, so this job
        # cannot drift from the declaration it is meant to be testing.
        run: python scripts/install_dependency_floors.py

      - name: Show what is installed
        run: python -m pip list

      - name: Pytest at the floors
        # No coverage: this job is about which versions the code runs on, and the floor is
        # measured by whether the suite passes, not by how much of it executed.
        run: python -m pytest tests --ignore=tests/property -q -p no:cacheprovider

  container-build:
    name: Container (build only, no push)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    # The image was built for the first time when the release tag was pushed: nothing built
    # it on a pull request, so a Dockerfile change that broke the build surfaced only after
    # the tag existed and PyPI had already published. This job builds it and throws it away,
    # so the Dockerfile is proven before a release depends on it. It does not log in, does
    # not push, and needs no registry credentials.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # `audit` for the same reason as the base-image scan and publish-container.yml:
          # pulling from Docker Hub crosses dynamic CloudFront hosts that allowed-endpoints
          # cannot express. Harden-Runner's global blocklist still applies.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: oss-policy-kit:ci

      - name: The image runs, and runs as a non-root user
        run: |
          set -euo pipefail
          docker run --rm oss-policy-kit:ci --version
          uid="$(docker run --rm --entrypoint id oss-policy-kit:ci -u)"
          if [ "${uid}" = "0" ]; then
            echo "::error::The published image would run as root." >&2
            exit 1
          fi
          echo "runs as uid ${uid}"

      # Nothing scanned the image this build produces. The four Trivy jobs in
      # security-ci-cd.yml are `scan-type: fs` against the source tree, plus one
      # `scan-type: image` against the pinned BASE image -- and neither can see what
      # the build ADDS on top of the base: the venv, the `[all]` dependency closure,
      # and the pip the builder upgrades into it.
      #
      # Measured on the published `ghcr.io/lucashgrifoni/oss-policy-kit:10.0.15`, which
      # is also `latest`: 32 fixable vulnerabilities, 2 CRITICAL and 9 HIGH. Most came
      # from a base digest that was refreshed one day AFTER that release, so a build from
      # the current Dockerfile no longer carries them -- but nothing in CI would have
      # said so either way, which is the actual defect. The fs scan reports zero and
      # never mentions pip, because a `pip==` pin inside a RUN string is not a manifest.
      - name: Inventory the built image
        # Reports MEDIUM and up so the layer the other jobs cannot see is at least
        # visible in the log. Does not gate: the step below does that.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: oss-policy-kit:ci
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: Fail on fixable high-severity vulnerabilities in the built image
        # This one has teeth. `ignore-unfixed` keeps it actionable: every finding it
        # reports has a published fix, so going red always means there is something to
        # do -- refresh the base digest, or move a pinned version.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: oss-policy-kit:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
