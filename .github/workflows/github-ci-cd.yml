# Product CI for the Python package at repository root. Does not run npm at repo root.
# SBOM generation in the package job aligns with SBOM quality / provenance expectations (see BUILD-SBOM-QUAL-003 and release docs).

name: GitHub CI/CD

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
  merge_group:

# Note: this workflow intentionally has NO `paths-ignore`. The required Quality
# check includes the gitpage guardrail test (tests/infrastructure/test_gitpage_static_assets.py),
# so gitpage-only PRs must run it too. A previous `paths-ignore: gitpage/**` let a
# broken gitpage change (PR #29 Tailwind v4) reach master because Quality was skipped.

permissions:
  contents: read

concurrency:
  group: project-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Quality (lint, types, tests, self-check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project (dev)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy src/oss_policy_kit

      - name: Pytest
        # Measure coverage here but do not gate yet (--cov-fail-under=0); the
        # property-tests step appends and enforces the combined floor.
        run: python -m pytest tests --ignore=tests/property --cov=oss_policy_kit --cov-report= --cov-fail-under=0

      - name: Property-based tests
        # Append property-test coverage and enforce the combined floor
        # (fail_under=88 in pyproject; stated explicitly here as the gate).
        run: python -m pytest tests/property/ -v --hypothesis-show-statistics --cov=oss_policy_kit --cov-append --cov-report=term-missing --cov-fail-under=88

      - name: CLI help smoke
        run: |
          python -m oss_policy_kit --help
          python -m oss_policy_kit evaluate --help

      - name: Evaluate hardened example
        run: |
          python -m oss_policy_kit evaluate --target ./examples/hardened-repo --profile github-level-1 --output-dir ./out/ci-hardened-example

      - name: Self-check (github-level-1)
        run: |
          python -m oss_policy_kit evaluate --target . --profile github-level-1 --output-dir ./out/selfcheck-ci --fail-on fail

      - name: Smoke evaluate-many
        run: |
          python -m oss_policy_kit evaluate-many --target-root ./examples --profiles github-level-1 --output-dir ./out/ci-evaluate-many --skip-non-repos --quiet

      - name: Smoke scaffold-evidence
        run: |
          python -m oss_policy_kit scaffold-evidence --target ./out/ci-scaffold-test --platform github

      - name: Smoke collect-evidence dry-run
        run: |
          python -m oss_policy_kit collect-evidence --target . --platform github --repo "owner/repo" --output-dir ./out/ci-collect --dry-run

      - name: Smoke diff-reports
        run: |
          python -m oss_policy_kit diff-reports --before ./out/ci-hardened-example/evaluation-report.json --after ./out/selfcheck-ci/evaluation-report.json --no-fail-on-regression --format markdown

      - name: Upload evaluation outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oss-policy-kit-ci-out-${{ github.run_id }}
          path: ./out/**
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package (build, twine, SBOM)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install -U pip build twine cyclonedx-bom
          python -m pip install -e ".[dev]"

      - name: Clean artifact directories
        run: |
          rm -rf dist build src/*.egg-info

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine check
        run: python scripts/twine_check_dist.py

      - name: Generate CycloneDX SBOM
        run: python -m cyclonedx_py environment --output-format JSON --output-file dist/sbom.cyclonedx.json

      - name: Smoke install wheel
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ ${#wheels[@]} -eq 0 ]]; then
            echo "No wheel found under dist/" >&2
            exit 1
          fi
          python -m pip install "${wheels[0]}"
          python -m oss_policy_kit --help
          python -m oss_policy_kit evaluate --help
