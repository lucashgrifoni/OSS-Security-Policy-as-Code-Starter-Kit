name: Publish container image

# Builds the official oss-policy-kit container image, signs it with cosign
# (keyless via Sigstore + GitHub OIDC), generates a CycloneDX SBOM, and
# pushes everything to ghcr.io/<owner>/oss-policy-kit.
#
# Triggers:
#   - tag push matching v*  → publish stable image tagged with the version
#                              (e.g. v5.9.0 → ghcr.io/<owner>/oss-policy-kit:5.9.0)
#   - workflow_dispatch     → manual run, publishes :edge tag for previews
#
# Permissions are scoped per-job; the workflow has no top-level write perms.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: "Optional tag suffix appended after the version (e.g. 'rc1')"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign, publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `packages: write` is needed to push to ghcr.io.
      packages: write
      # `id-token: write` is needed for cosign keyless signing via Sigstore.
      id-token: write
      # `attestations: write` is needed for GitHub Artifact Attestations.
      attestations: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/oss-policy-kit
    steps:
      - name: Harden runner network audit
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # 'audit' (not 'block') by design: this job hits rotating GitHub Actions artifact
          # endpoints with no wildcard support in allowed-endpoints, so an exact block list would
          # break releases; harden-runner's global C2/exfil blocklist still applies. (egress audit v6.5.0)
          egress-policy: audit

      - name: Check out the source tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Derive image tags
        id: tags
        # `inputs.tag_suffix` reaches the shell through the environment, never through
        # template expansion into the script body: an expanded value is parsed by bash,
        # an environment variable is not.
        env:
          TAG_SUFFIX: ${{ inputs.tag_suffix }}
        run: |
          set -euo pipefail
          REF="${GITHUB_REF#refs/tags/}"
          SUFFIX="$TAG_SUFFIX"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${REF#v}"
            if [[ -n "$SUFFIX" ]]; then VERSION="$VERSION-$SUFFIX"; fi
            TAGS="$REGISTRY/$IMAGE_NAME:$VERSION,$REGISTRY/$IMAGE_NAME:latest"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge" >> "$GITHUB_OUTPUT"
            echo "tags=$REGISTRY/$IMAGE_NAME:edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          provenance: mode=max
          sbom: true
          build-args: |
            KIT_VERSION=${{ steps.tags.outputs.version }}
          labels: |
            org.opencontainers.image.title=oss-policy-kit
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: "v2.4.0"

      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          IFS=',' read -ra TAG_LIST <<< "$TAGS"
          for tag in "${TAG_LIST[@]}"; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: Generate GitHub Artifact Attestation for image
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "## Published container image"
            echo ""
            echo "- **Tags**: ${{ steps.tags.outputs.tags }}"
            echo "- **Digest**: ${{ steps.build.outputs.digest }}"
            echo "- **Cosign**: signed (keyless, Sigstore Public Good)"
            echo "- **Provenance**: GitHub Artifact Attestation pushed to registry"
            echo "- **SBOM**: attached via Buildx (sbom=true)"
            echo "- **Platforms**: linux/amd64, linux/arm64"
            echo ""
            echo "Verify locally:"
            echo ""
            echo '```bash'
            echo "cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.+' \\"
            echo "  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'"
            echo "gh attestation verify oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }} \\"
            echo "  --repo ${{ github.repository }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
