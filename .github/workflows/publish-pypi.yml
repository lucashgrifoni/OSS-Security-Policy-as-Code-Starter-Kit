name: Publish to PyPI

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/publish-pypi.yml"
      - "pyproject.toml"
      - "src/**"
      - "scripts/twine_check_dist.py"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Target repository (pypi or testpypi)"
        required: true
        default: "testpypi"
        type: choice
        options:
          - pypi
          - testpypi

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden runner network audit
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # 'audit' (not 'block') by design: these jobs hit rotating GitHub Actions artifact
          # endpoints with no wildcard support in allowed-endpoints, so an exact block list would
          # break releases; harden-runner's global C2/exfil blocklist still applies. (egress audit v6.5.0)
          egress-policy: audit

      # v4: tags pinned to immutable SHAs (supply-chain hardening).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install build tools
        # Hash-pinned (Scorecard Pinned-Dependencies). This job builds and signs the
        # artifact adopters install, so anything that enters it is in the trusted path.
        run: pip install --require-hashes -r .github/requirements/build-tools.txt

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distribution
        run: python scripts/twine_check_dist.py

      - name: Generate GitHub Artifact Attestation for distributions
        id: attest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: "dist/*"

      # The SBOM has to inventory the RELEASE, not the runner. `cyclonedx_py environment` with no
      # path takes the current environment, and the line above has just filled it with the build
      # tools -- so the file published with v10.0.15 listed 61 components (twine, build, keyring,
      # SecretStorage, certifi) with `oss-policy-kit` absent and the wheel's real closure
      # (click, jsonschema, pyyaml, typer) absent too. An adopter matching CVEs against it was
      # scanning the publishing machine.
      #
      # So the generator runs from HERE against a throwaway environment that holds the built
      # wheel. Generating from inside that environment instead would pull cyclonedx-py's own
      # dependencies into the inventory; measured, that was the difference between 46 components
      # and the 18 the artifact actually has.
      #
      # Limitation worth naming: the closure is whatever pip resolves at publish time, so this
      # inventories the release as built, not as any later adopter will install it.
      - name: Generate SBOM
        run: |
          pip install --require-hashes -r .github/requirements/build-tools.txt
          mkdir -p artifacts
          python -m venv .sbom-env
          .sbom-env/bin/python -m pip install dist/*.whl
          python -m cyclonedx_py environment .sbom-env --of JSON -o artifacts/sbom.cyclonedx.json

      - name: Stage provenance bundle for release assets
        run: |
          mkdir -p artifacts
          cp "${{ steps.attest.outputs.bundle-path }}" artifacts/oss-policy-kit.intoto.jsonl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: artifacts/sbom.cyclonedx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: provenance
          path: artifacts/oss-policy-kit.intoto.jsonl

  release-assets:
    name: Attach signed assets to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only on tag pushes: attach the built distributions, SBOM, and the
    # provenance bundle to the GitHub Release so adopters can download and
    # verify them (see docs/supply-chain-verification.md). OpenSSF Scorecard
    # Signed-Releases looks for signed assets attached to releases.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Harden runner network audit
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # 'audit' (not 'block') by design: these jobs hit rotating GitHub Actions artifact
          # endpoints with no wildcard support in allowed-endpoints, so an exact block list would
          # break releases; harden-runner's global C2/exfil blocklist still applies. (egress audit v6.5.0)
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: artifacts/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance
          path: artifacts/

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The Release notes workflow creates the draft release; if this job
          # wins the race, create the draft so the upload has a target.
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --draft --verify-tag \
              --title "OSS Security Policy as Code Starter Kit ${TAG}" \
              --notes "Draft created by publish-pypi to attach signed assets; release notes are refined separately."
          fi
          gh release upload "${TAG}" \
            dist/* \
            artifacts/sbom.cyclonedx.json \
            artifacts/oss-policy-kit.intoto.jsonl \
            --clobber

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/oss-policy-kit
    permissions:
      id-token: write
    steps:
      - name: Harden runner network audit
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # 'audit' (not 'block') by design: these jobs hit rotating GitHub Actions artifact
          # endpoints with no wildcard support in allowed-endpoints, so an exact block list would
          # break releases; harden-runner's global C2/exfil blocklist still applies. (egress audit v6.5.0)
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/p/oss-policy-kit
    permissions:
      id-token: write
    steps:
      - name: Harden runner network audit
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # 'audit' (not 'block') by design: these jobs hit rotating GitHub Actions artifact
          # endpoints with no wildcard support in allowed-endpoints, so an exact block list would
          # break releases; harden-runner's global C2/exfil blocklist still applies. (egress audit v6.5.0)
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          skip-existing: true
