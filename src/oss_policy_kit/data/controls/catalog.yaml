version: 1
# lifecycle values: experimental | stable | deprecated
# - experimental: semantics may change; do not gate strict CI on this without pinning kit version.
# - stable: intended stable semantics for the current major.minor kit line.
# - deprecated: retained for compatibility; scheduled for removal in a future release.
#
# assurance (control maturity of proof):
# - deterministic: strong local proof (filesystem / structural parsing).
# - signal: heuristic or partial observability from repo signals.
# - evidence-backed: depends on validated .oss-policy-kit/evidence JSON and/or live API collection.
#
# weight (risk-adjusted scoring, 1-3):
# - 3: critical — direct security impact or supply-chain integrity risk.
# - 2: high — important governance, identity, or CI discipline controls.
# - 1: medium — presence/hygiene checks and signal-grade heuristics.
