id: azure-release-hardening-3
title: Azure release hardening — hard-gate + release signals (level 3)
description: >
  Strictest bundled Azure release profile: **azure-level-3** hard-gate core (evidence freshness,
  branch + pipeline governance with API fidelity metadata, service connection and federation
  decomposition, artifact SBOM/provenance) **plus** the **signal** bundle (**AZ-SEC/SBOM/SCA-031..033**)
  for release-time visibility. Adds GOV-EVIDFRESH-054, AZ-SCONN-056, AZ-WIFEV-057, and
  AZ-ARTSBOM/ARTPRV-058/059 over level 2. Also includes dependency auto-update detection,
  container image security posture (digest pinning, non-root user, image scanning), org-level
  MFA enforcement evidence, and SBOM quality signals.
  Maturity note: this is the strictest bundled Azure release gate, but the **031..033** bundle stays
  `assurance: signal` — treat their PASS as directional release-time visibility, not proof. Inside
  this kit GitHub remains the most mature path; use `github-release-hardening-3` as the extreme
  reference until Azure evidence collection reaches parity.
  **Natural next step:** keep evidence live via `collect-evidence --platform azure` and explicit waivers — this is the ceiling of the bundled Azure release profile set.
  **Framework alignment:** see `docs/framework-alignment.md` (Azure DevOps Security Best Practices fully covered except Audit-log/SIEM; SLSA Build L2 evidence expectations met when collect-evidence runs live).
audience: High-assurance Azure DevOps teams combining API-backed evidence with release hygiene signals.
