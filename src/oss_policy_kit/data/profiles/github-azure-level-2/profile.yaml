id: github-azure-level-2
title: GitHub SCM + Azure Pipelines — advisory (level 2)
description: >
  **Advisory-only hybrid profile. Do not use as a release gate. Recommended `--fail-on degraded`.**
  Multi-platform profile for repositories that use **GitHub** as the SCM layer and
  **Azure Pipelines** as the CI/CD layer. Combines the full GitHub workflow hardening signal bundle
  (reusable workflows, runner trust, job permissions, release safety, merge queue) with the Azure
  advisory control set (pipeline structure, template security, credential persistence, deployment
  identity YAML signals). Also includes dependency auto-update detection, container image security
  posture checks (digest pinning, non-root user, image scanning — not-applicable when no Dockerfile
  present), and general secrets/lockfile hygiene. Platform truth (branch policies, environments,
  service connections) still requires evidence or collect-evidence — not inferred as a hard gate here.
  Explicit positioning: this profile is **advisory**, not a hard gate. For strict gates, use
  `github-level-3` / `github-release-hardening-3` or the `azure-*-3` profiles, depending on which
  CI/CD platform should serve as the source of truth.
  **CRA caveat:** this hybrid does **not** satisfy EU Cyber Resilience Act single-product evidence.
  CRA expects per-product SBOM and provenance bound to one shipping pipeline. Run `cra-eu-ready-1`
  or one of the platform-specific `*-release-hardening-3` profiles for CRA-aligned posture.
  **Natural next step:** adopt `azure-level-3` or `github-level-3` separately when you need a true hard-gate on one platform.
audience: >
  Teams that host source on GitHub but build and deploy through Azure Pipelines, seeking a unified
  advisory discipline without maintaining evidence files.
