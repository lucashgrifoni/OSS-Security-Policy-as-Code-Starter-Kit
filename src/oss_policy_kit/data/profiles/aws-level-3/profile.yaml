id: aws-level-3
title: AWS — hard-gate (level 3)
description: >
  **Hard-gate** profile: governance, deterministic buildspec/pipeline checks, evidence-backed
  CodePipeline/CodeBuild posture, IAM and identity boundaries, artifact-bound SBOM/provenance JSON,
  evidence freshness, dependency auto-update detection, container image security posture (digest
  pinning, non-root user, image scanning), org-level MFA enforcement evidence, and SBOM quality
  signals. Does **not** treat buildspec text signals (AWS-SEC/SBOM/SCA/PROV) as hard proof —
  those stay in advisory profiles. Prefer `collect-evidence` so API-backed outcomes can reach
  PASS with live collection metadata.
  Maturity note: this is the strictest bundled AWS gate, but it still depends more on evidence
  discipline than the GitHub hard-gate family. Treat `github-level-3` / `github-release-hardening-3`
  as the most mature reference inside this kit until AWS evidence collection reaches parity.
  **Natural next step:** `aws-release-hardening-3` when release-time signal visibility should sit on top of this hard-gate.
  **Framework alignment:** see `docs/framework-alignment.md` (AWS Well-Architected Security Pillar covers IAM federation, identity, automation; Enable-Traceability is GAP; SLSA Build L2 directional; OWASP CICD Top 10 covers 8/10).
audience: Security-focused AWS maintainers who need defensible gates beyond clone-only heuristics.
