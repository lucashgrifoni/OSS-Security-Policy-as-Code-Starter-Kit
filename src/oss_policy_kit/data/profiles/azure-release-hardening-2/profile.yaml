id: azure-release-hardening-2
title: Azure release hardening — advisory + evidence (level 2)
description: >
  Extends **azure-level-2** (advisory) with **AZ-PLAT-034** and **AZ-PLAT-035** evidence. Stronger than
  release-hardening-1 because the pipeline discipline and identity YAML signals are already required.
  Includes dependency auto-update detection and container image security posture checks (digest
  pinning, non-root user, image scanning signals).
  **Natural next step:** `azure-release-hardening-3` for the strictest bundled Azure release gate.
  **Framework alignment:** see `docs/framework-alignment.md` (Azure DevOps Security Best Practices on branch policies + pipeline approvals; SLSA Build L2 evidence expectations directional when JSONs are filled).
audience: Teams combining curated YAML with Azure DevOps governance evidence for releases.
