id: aws-release-hardening-2
title: AWS release hardening — advisory + evidence (level 2)
description: >
  Extends **aws-level-2** (advisory) with CodePipeline and CodeBuild evidence files for promotion
  and project posture. Stronger than level 1 release hardening because committed pipeline exports
  must already meet the structured bar (AWS-PIPE-042). Includes dependency auto-update detection
  and container image security posture checks (digest pinning,   non-root user, image scanning signals).
  **Natural next step:** `aws-release-hardening-3` for the strictest bundled AWS release gate.
  **Framework alignment:** see `docs/framework-alignment.md` (AWS Well-Architected DevOps lens on automate-best-practices, IAM federation; SLSA Build L2 evidence expectations directional when JSONs are filled).
audience: AWS teams combining curated pipeline files with platform evidence JSON for releases.
