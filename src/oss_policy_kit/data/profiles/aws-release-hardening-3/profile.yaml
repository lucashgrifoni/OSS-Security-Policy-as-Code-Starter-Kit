id: aws-release-hardening-3
title: AWS release hardening — hard-gate + release signals (level 3)
description: >
  Strictest bundled AWS release profile: **aws-level-3** hard-gate core (deterministic + evidence-backed
  controls, IAM/identity, artifact-bound SBOM/provenance, evidence freshness) **plus** the same
  buildspec **signal** bundle as level 2 for release hygiene visibility. Adds GOV-EVIDFRESH-054,
  AWS-PIPEIAM-056, AWS-CBIDENT-057, AWS-SBOMART-058, and AWS-PROVART-059 over level 2. Also includes
  dependency auto-update detection, container image security posture (digest pinning, non-root user,
  image scanning), org-level MFA enforcement evidence, and SBOM quality signals. Optional CodeCommit
  evidence (`AWS-CC-046`) is intentionally omitted so the gate does not depend on CodeCommit.
  Maturity note: this is the strictest bundled AWS release gate, but the buildspec **signal** bundle
  stays `assurance: signal` — treat their PASS as directional release-time visibility, not proof.
  Inside this kit GitHub remains the most mature path; use `github-release-hardening-3` as the
  extreme reference until AWS evidence collection reaches parity.
  **Natural next step:** keep evidence live via `collect-evidence --platform aws` and explicit waivers — this is the ceiling of the bundled AWS release profile set.
  **Framework alignment:** see `docs/framework-alignment.md` (AWS Well-Architected Security Pillar covers IAM federation, identity, automation; Enable-Traceability is GAP; SLSA Build L2 evidence expectations met when collect-evidence runs live).
audience: High-assurance AWS teams combining API-collectable evidence with release-time supply-chain signals.
