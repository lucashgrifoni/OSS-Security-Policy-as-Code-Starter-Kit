id: cra-eu-reporting-1
title: EU Cyber Resilience Act - 24h reporting readiness (2026-09-11 obligations)
description: >
  **Regulatory mapping (advisory only). Do not use as a release gate. Not a compliance
  certification.** Focused on the EU CRA's first enforceable deadline: from 2026-09-11,
  manufacturers must report actively exploited vulnerabilities to ENISA and designated
  national CSIRTs within 24 hours of becoming aware. This profile bundles the
  *technical preconditions* a manufacturer needs to plausibly meet that 24-hour clock:
  a documented disclosure channel, fresh evidence of vulnerability handling, an audit
  trail for incident reporting, detection signals (dependency review, secret scanning,
  auto-update), waiver discipline for accepted risks, change history (release notes),
  and SBOM quality so the affected artifact can be identified. The 24-hour reporting
  obligation itself is a *process* outside the kit's evidence surface — this profile
  cannot prove you will meet 24 hours; it can only show you have the technical
  scaffolding to do so.
  **Posture:** advisory. Distinct from `cra-eu-ready-1` (broader CRA reporting
  preparation) and `cra-eu-strict-1` (2027-12-11 full-obligations deadline).
  **Recommended `--fail-on`:** `degraded`. CRA conformity assessment requires a
  competent authority (notified body, CE-marking) and is outside the kit's scope.
  **Framework alignment:** see `docs/framework-alignment.md` (EU Cyber Resilience Act
  section) and `docs/cra-readiness.md` (what the kit proves vs what stays with the
  operator).
audience: >
  Manufacturers placing software products on the EU market who need a clone-side posture
  check before 2026-09-11. Use as a discovery surface ("do I have the technical
  scaffolding to file a 24-hour CRA report?"), not as a release gate and not as a
  conformity assessment.
controls:
  # Disclosure channel — the report has to go somewhere; the channel has to exist
  # and carry an explicit acknowledgement SLA so the 24h outbound clock is meetable.
  - GOV-SEC-001
  - GOV-DISC-013
  - GOV-DISC-065
  # Detection capability — you cannot report what you cannot detect.
  - SEC-DEPREV-011
  - DEP-UPDATE-001
  - SEC-SECRETS-050
  # Audit trail — the 24-hour report needs evidence of timeline and impact.
  - AUDIT-STREAM-060
  - GOV-EVIDFRESH-054
  # Risk handling discipline — accepted risks vs newly exploited ones must be
  # distinguishable; waivers carry owner + expiry.
  - GOV-WAIV-014
  # Change history — the report identifies the affected version.
  - REL-CHANGE-012
  # SBOM quality — the report identifies the affected component.
  - BUILD-SBOM-QUAL-003
