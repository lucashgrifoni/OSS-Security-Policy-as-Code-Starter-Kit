id: cra-eu-strict-1
title: EU Cyber Resilience Act - strict track (2027-12-11 obligations)
description: >
  **Regulatory mapping (advisory only). Do not use as a release gate. Not a compliance
  certification.** Stricter version of `cra-eu-ready-1` aimed at the EU CRA
  full-obligations deadline of 2027-12-11. Adds 7 controls beyond `cra-eu-ready-1` to
  cover GitHub platform governance evidence (rulesets, environments, secret scanning),
  org-wide MFA, action pinning, and secret scanning posture. Bundles 19 existing
  controls total. Without filled evidence files, the strict-track-specific controls
  (rulesets, environments, secret scanning, provenance verification) surface as
  `manual-review-required` — an honest gap, not a crash.
  **Posture:** advisory. CRA reporting deadline is 2026-09-11; full obligations apply
  2027-12-11. This profile is a *mapping* between the kit's existing evidence and CRA
  strict-track expectations — it does not certify compliance.
  **Recommended `--fail-on`:** `degraded`. CRA conformity assessment requires a
  competent authority (notified body, CE-marking) and is outside the kit's scope.
  **Framework alignment:** see `docs/framework-alignment.md` (EU Cyber Resilience Act section).
audience: >
  Manufacturers placing software products on the EU market who need to prepare for
  the full CRA obligations deadline (2027-12-11), including conformity assessment
  documentation. Use as a clone-side posture indicator; the formal CE-marking and
  conformity assessment are external to the kit.
controls:
  # CRA Article 13 - security requirements (existing 12 from cra-eu-ready-1)
  - GOV-SEC-001
  - GOV-DISC-013
  - GOV-WAIV-014
  - REL-CHANGE-012
  - BUILD-SBOM-QUAL-003
  - PROV-VERIFY-061
  - AUDIT-STREAM-060
  - RELEASE-ARCHIVE-063
  - SEC-DEPREV-011
  - DEP-UPDATE-001
  - PLAT-BRPROT-015
  - GOV-EVIDFRESH-054
  # Strict-track additions for 2027-12-11 obligations (7 new)
  - GH-PROV-023
  - GH-PLAT-024
  - GH-PLAT-025
  - GH-PLAT-026
  - ORG-MFA-001
  - CI-PIN-008
  - SEC-SECRETS-050
