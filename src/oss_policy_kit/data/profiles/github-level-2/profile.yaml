id: github-level-2
title: GitHub OSS advisory baseline (level 2)
description: >
  **Advisory** profile: extends the starter baseline with stricter workflow hardening signals
  (reusable workflows, runner trust, job permissions, release safety, merge queue posture),
  dependency auto-update detection, OpenSSF Scorecard signal, and container image security
  posture checks (digest pinning, non-root user, image scanning signals).
  **Natural next step:** `github-level-3` for evidence-backed GitHub gates, or `github-release-hardening-2`
  for the release ladder at similar depth.
audience: Maintainers with disciplined CI/CD who want stronger clone-verifiable controls.
