id: s2c2f-l3-1
title: Microsoft S2C2F Level 3 alignment (Secure OSS consumption with provenance verification + audit trail)
description: >
  **Advisory mapping (advisory only). Do not use as a release gate.**
  Multi-platform profile aligned with Microsoft Secure Supply Chain Consumption
  Framework (S2C2F) Level 3. Builds on `s2c2f-l2-1` by adding the Level 3
  expectations: provenance verification (`PROV-VERIFY-061`), audit-log
  streaming (`AUDIT-STREAM-060`), signed-releases signal (`GH-PROV-023`),
  and secret-scan discipline at ingestion (`SAST-GITLEAKS-069`). Bundles
  16 existing controls — zero new evaluators, zero new control IDs
  (see ADR-005).
  **Posture:** advisory mapping. **Recommended `--fail-on`:** `degraded` only.
  **Framework alignment:** see `docs/framework-alignment.md` (Microsoft S2C2F section).
audience: >
  Teams that consume OSS at scale and have adopted L1 + L2; ready to add
  provenance verification, audit trail, and secret-scan discipline. Pair
  with a release-hardening profile for the producer side.
controls:
  # Ingest (L1 + L2)
  - SEC-PINLOCK-052
  - CI-PIN-008
  - CI-WFCALLSHA-055
  # Scan (L2 + L3 addition — secret scanning on ingestion)
  - SAST-OSV-068
  - SAST-GITLEAKS-069
  # Inventory (L1)
  - BUILD-SBOM-QUAL-003
  # Update (L1)
  - DEP-UPDATE-001
  # Audit (L1 + L3 addition — audit-log streaming)
  - SEC-DEPREV-011
  - OSS-SCORECARD-001
  - AUDIT-STREAM-060
  # License (L2)
  - GOV-LIC-004
  # Provenance (L3 addition — verification + signed-release signal)
  - PROV-VERIFY-061
  - GH-PROV-023
  # Govern (sustaining; L1 baseline)
  - GOV-WAIV-014
  - GOV-DISC-013
  - GOV-SEC-001
