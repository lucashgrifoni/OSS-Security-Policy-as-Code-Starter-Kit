id: azure-level-3
title: Azure — hard-gate (level 3)
description: >
  **Hard-gate** profile: governance, **GOV-EVIDFRESH-054**, deterministic pipeline presence,
  evidence-backed **Azure Repos** and **pipeline governance** (**AZ-PLAT-034**, **AZ-PLAT-035**),
  decomposed service-connection (**AZ-SCONN-056**) and federation (**AZ-WIFEV-057**) controls,
  artifact-bound SBOM/provenance JSON, **AZ-IDENT-036** grounded in governance evidence when present,
  dependency auto-update detection, container image security posture (digest pinning, non-root user,
  image scanning), org-level MFA enforcement evidence, and SBOM quality signals.
  Buildspec-style scanner signals (**AZ-SEC/SBOM/SCA-031..033**) are **not** in this gate set so the
  profile cannot go “all green” from YAML mentions alone.
  Maturity note: this is the strictest bundled Azure gate, but it still relies more on evidence
  discipline than the GitHub hard-gate family. Treat `github-level-3` / `github-release-hardening-3`
  as the most mature reference inside this kit until Azure evidence collection reaches parity.
  **Natural next step:** `azure-release-hardening-3` when release-time signal visibility should sit on top of this hard-gate.
  **Framework alignment:** see `docs/framework-alignment.md` (Azure DevOps Security Best Practices fully covered except Audit-log/SIEM; SLSA Build L2 directional; OWASP CICD Top 10 covers 8/10).
audience: Security-focused maintainers who need defensible Azure DevOps gates beyond clone heuristics.
controls:
