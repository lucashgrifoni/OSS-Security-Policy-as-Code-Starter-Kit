id: github-level-3
title: GitHub OSS hard-gate baseline (level 3)
description: >
  **Hard-gate** profile: deterministic checks plus GitHub platform evidence files and
  stricter workflow signals (merge queue, reusable workflow SHA pins, evidence freshness).
  Includes dependency auto-update detection, OpenSSF Scorecard signal, container image
  security posture (digest pinning, non-root user, image scanning), org-level MFA enforcement
  evidence, and SBOM quality signals. Deprecated controls and weak-only cloud OIDC /
  provenance / secret-scan YAML signals are excluded so this profile can be used as a
  strong gate when evidence is maintained.
  **Natural next step:** `github-release-hardening-3` when releases are the primary risk surface;
  otherwise maintain evidence freshness and live collectors — there is no higher bundled pure-repo gate.
  **Framework alignment:** see `docs/framework-alignment.md` (Scorecard 11/19 YES + 3 PARTIAL; OWASP CICD Top 10 covers 8/10; NIST SSDF PS/PW are deepest).
audience: Security-focused maintainers seeking strict GitHub supply-chain posture with evidence.
