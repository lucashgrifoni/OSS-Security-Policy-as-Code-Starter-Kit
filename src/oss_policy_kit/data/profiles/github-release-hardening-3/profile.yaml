id: github-release-hardening-3
title: GitHub release hardening add-on (level 3)
description: >
  **Hard-gate + evidence**: strictest bundled GitHub profile — workflow posture, platform
  governance evidence (rulesets, environments, secret scanning), merge queue and reusable
  workflow SHA discipline, evidence freshness, dependency auto-update detection, OpenSSF
  Scorecard signal, container image security posture (digest pinning, non-root user, image
  scanning), org-level MFA enforcement evidence, and SBOM quality signals. Deprecated
  YAML-only audit/SBOM controls and weak-only deploy/provenance signals are excluded from
  active gating.
  **Natural next step:** operate live `collect-evidence` and policy waivers explicitly — this is the
  ceiling of the bundled GitHub release profile set.
  **Framework alignment:** see `docs/framework-alignment.md` (Scorecard 11/19 YES + 3 PARTIAL; OSPS Mature; SLSA Build L2 evidence expectations met when collect-evidence runs live; OWASP CICD Top 10 covers 8/10).
audience: Teams with high-assurance release governance and explicit platform evidence discipline.
