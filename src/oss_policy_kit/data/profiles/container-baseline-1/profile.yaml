id: container-baseline-1
title: Container hardening baseline (advisory)
description: >
  **Advisory** profile bundling the v5.6 container hardening pack:
  digest-pinned base images, non-root USER, image scanning signal,
  multi-stage Dockerfile, HEALTHCHECK, no curl|bash patterns, .dockerignore,
  apt-get hygiene, OS package version pinning, and container image signing
  via cosign / GitHub artifact attestations. Includes ``GOV-EVIDFRESH-054``
  to flag stale supplemental container evidence.
  All `CONT-RUNTIME-*` and `CONT-SIGN-001` controls ship as
  `lifecycle: experimental`, `assurance: signal`. Use with `--fail-on degraded`
  to surface container-runtime drift without blocking releases.
  **Composition note:** this profile contains **only** container-related
  controls. For governance baseline (SECURITY.md, waivers policy,
  disclosure policy) compose with ``osps-baseline-1`` or a
  ``*-release-hardening-*`` profile. For Kubernetes posture compose with
  ``kubernetes-baseline-1``. Combine with `github-level-2` /
  `azure-level-2` / `aws-level-2` (or their `*-level-3` hard-gate variants)
  for the full release picture. The kit's clone-visible signals do **not**
  replace runtime posture checks.
audience: Platform / AppSec teams hardening container builds at PR time.
controls:
  # Evidence freshness for supplemental container evidence
  - GOV-EVIDFRESH-054
  # Container image hygiene (3)
  - CONT-IMAGE-001
  - CONT-IMAGE-002
  - CONT-IMAGE-003
  # Container runtime hardening (6)
  - CONT-RUNTIME-001
  - CONT-RUNTIME-002
  - CONT-RUNTIME-003
  - CONT-RUNTIME-004
  - CONT-RUNTIME-005
  - CONT-RUNTIME-006
  # Container image signing
  - CONT-SIGN-001
